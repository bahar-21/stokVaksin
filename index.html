    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // KONFIGURASI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzYRWtMss4mafbjt9jYTcVi38x6vuJR6Izs2EC1qZPkTOSRuMXlPNwjWuE-09t5nMOJ/exec"; 
        // ==========================================

        // ==========================================
        // UTILITY & DATABASE
        // ==========================================
        const mergeUnique = (oldData, newData) => {
            const map = new Map();
            [...oldData, ...newData].forEach(item => {
                if(item && item.id) map.set(item.id, item);
            });
            return Array.from(map.values());
        };

        const createStableId = (prefix, data) => {
            const str = Object.values(data).join('|');
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; 
            }
            return `${prefix}-${Math.abs(hash)}`;
        };

        const dbName = "VaxTrackDB_v3"; 
        const storeNames = ["master", "transactions"];

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    storeNames.forEach(name => {
                        if (!db.objectStoreNames.contains(name)) {
                            db.createObjectStore(name, { keyPath: "id" });
                        }
                    });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject("IndexedDB Error");
            });
        };

        const dbOp = async (storeName, mode, operation) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, mode);
                const store = tx.objectStore(storeName);
                const request = operation(store);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToLocal = async (storeName, data) => {
            if (Array.isArray(data)) {
                for (const item of data) {
                    await dbOp(storeName, "readwrite", s => s.put(item));
                }
            } else {
                await dbOp(storeName, "readwrite", s => s.put(data));
            }
        };

        const getFromLocal = async (storeName) => {
            return new Promise((resolve) => {
                dbOp(storeName, "readonly", s => s.getAll()).then(resolve);
            });
        };

        // ==========================================
        // ICONS
        // ==========================================
        const Package = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>);
        const ArrowLeftRight = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>);
        const PlusCircle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>);
        const Search = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
        const TrendingUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>);
        const TrendingDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>);
        const Syringe = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>);
        const Trash2 = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
        const X = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const ChevronDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>);
        const ChevronUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>);
        const FileUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
        const FileDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
        const RefreshCcw = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-9 9Z"/><path d="M12 12v4"/><path d="m16 16-4 4-4-4"/></svg>);
        const AlertCircle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>);
        const FileText = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>);
        const Copy = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>);

        function App() {
            const [activeTab, setActiveTab] = useState('stock');
            const [toast, setToast] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const fileInputRef = useRef(null);

            const [vaccines, setVaccines] = useState([]);
            const [transactions, setTransactions] = useState([]);

            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isVaxModalOpen, setIsVaxModalOpen] = useState(false);
            const [isCsvPreviewOpen, setIsCsvPreviewOpen] = useState(false);
            const [expandedVaxId, setExpandedVaxId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterType, setFilterType] = useState('all');

            const [cardVaxId, setCardVaxId] = useState('');
            const [cardLotId, setCardLotId] = useState('');

            const [vaxForm, setVaxForm] = useState({ name: '', category: 'Vaksin Wajib', minStock: 10 });
            const [csvPreviewItems, setCsvPreviewItems] = useState([]);
            const [txType, setTxType] = useState('masuk');
            const [txHeader, setTxHeader] = useState({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
            const [txItems, setTxItems] = useState([{}]);

            // State for Daily Report
            const [reportDate, setReportDate] = useState(new Date().toISOString().split('T')[0]);

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const superFormatDate = (dateVal) => {
    if (!dateVal) return '';
    
    // 1. Jika input adalah string, kita bersihkan dulu
    if (typeof dateVal === 'string') {
        // Jika formatnya ISO (ada huruf T), ambil 10 karakter pertama saja (YYYY-MM-DD)
        // Contoh: "2026-09-02T00:00:00.000Z" -> "2026-09-02"
        if (dateVal.includes('T')) {
            return dateVal.split('T')[0];
        }

        // Jika formatnya sudah YYYY-MM-DD, langsung kembalikan
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateVal)) {
            return dateVal;
        }

        // Jika formatnya DD/MM/YYYY atau DD-MM-YYYY
        const parts = dateVal.split(/[\/\-]/);
        if (parts.length === 3 && parts[0].length <= 2) {
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            const year = parts[2].length === 4 ? parts[2] : '20' + parts[2];
            return `${year}-${month}-${day}`;
        }
    }
    
    // 2. Jika input benar-benar berupa objek Date (jarang terjadi dari JSON)
    try {
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal;
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    } catch (e) { 
        return dateVal; 
    }
};


            // ==========================================
            // SYNC ENGINE
            // ==========================================
            const syncFromCloud = async (silent = false) => {
                setIsSyncing(true);
                try {
                    const resMaster = await fetch(`${GAS_URL}?sheet=Master`);
                    const dataMaster = await resMaster.json();
                    const masterFormatted = dataMaster.map(item => ({
                        id: item.idvaksin || item.namavaksin.toLowerCase().replace(/\s+/g, ''), 
                        name: item.namavaksin, category: item.kategori, minStock: Number(item.batasminimum)
                    }));
                    await saveToLocal("master", masterFormatted);
                    setVaccines(masterFormatted);

                    const resMasuk = await fetch(`${GAS_URL}?sheet=Masuk`);
                    const dataMasuk = await resMasuk.json();
                    const masukFormatted = dataMasuk.map(item => ({
                        id: item.idtransaksi || createStableId('TX-M', item), 
                        vaccineId: item.namavaksin.toLowerCase().replace(/\s+/g, ''), vaccineName: item.namavaksin, type: 'masuk',
                        date: superFormatDate(item.tanggal), sourceOrFor: item.sumber,
                        lotId: item.idmasuk || item.lotid || `lot-${item.namavaksin.toLowerCase().replace(/\s+/g, '')}`, 
                        producer: item.merk || item.producer || '-', batchNo: item.nobatch || item.batchno || '-',
                        expireDate: superFormatDate(item.kadaluarsa), dose: item.dosis || '-', unit: item.satuan || 'dosis',
                        qty: Number(item.jumlah), notes: ''
                    }));

                    const resKeluar = await fetch(`${GAS_URL}?sheet=Keluar`);
                    const dataKeluar = await resKeluar.json();
                    const keluarFormatted = dataKeluar.map(item => ({
                        id: item.idtransaksi || createStableId('TX-K', item),
                        vaccineId: item.namavaksin.toLowerCase().replace(/\s+/g, ''), 
                        vaccineName: item.namavaksin, type: 'keluar',
                        date: superFormatDate(item.tanggal), sourceOrFor: item.peruntukan,
                        lotId: item.lotid || item.idmasuk || '-', 
                        producer: item.merk || item.producer || '-', batchNo: item.nobatch || item.batchno || '-',
                        expireDate: superFormatDate(item.kadaluarsa), dose: item.dosis || '-', unit: item.satuan || 'dosis',
                        qty: Number(item.jumlah), notes: ''
                    }));

                    const allTxs = [...masukFormatted, ...keluarFormatted];
                    await saveToLocal("transactions", allTxs);
                    setTransactions(allTxs);

                    if (!silent) showToast('Data sinkron dengan Cloud!', 'success');
                } catch (e) {
                    if (!silent) showToast('Gagal sinkronisasi Cloud', 'error');
                }
                setIsSyncing(false);
            };

            const syncToCloud = async (payload) => {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { console.error("Cloud Sync Error:", e); }
            };

            useEffect(() => {
                const loadInitialData = async () => {
                    const localMaster = await getFromLocal("master");
                    const localTxs = await getFromLocal("transactions");
                    if (localMaster.length === 0 || localTxs.length === 0) {
                        await syncFromCloud();
                    } else {
                        setVaccines(localMaster);
                        setTransactions(localTxs);
                    }
                };
                loadInitialData();
            }, []);

            // ==========================================
            // STOCK CALCULATION
            // ==========================================
            const getCalculatedStock = () => {
                const today = new Date();
                return vaccines.map((vax) => {
                    const vaxTxs = transactions.filter(t => t.vaccineId === vax.id || t.vaccineName === vax.name);
                    const lotMap = {};
                    
                    vaxTxs.forEach((tx) => {
                        const key = tx.lotId;
                        if (!key || key === '-') return;
                        if (!lotMap[key]) {
                            lotMap[key] = { 
                                lotId: key, batchNo: tx.batchNo, expireDate: tx.expireDate, producer: tx.producer, 
                                unitName: tx.unit || 'unit', dosePerUnit: parseFloat(tx.dose) || 1,
                                masuk: 0, keluar: 0, currentUnits: 0, currentDoses: 0 
                            };
                        }
                        if (tx.type === 'masuk') lotMap[key].masuk += Number(tx.qty);
                        else lotMap[key].keluar += Number(tx.qty);
                        
                        lotMap[key].currentUnits = lotMap[key].masuk - lotMap[key].keluar;
                        lotMap[key].currentDoses = lotMap[key].currentUnits * lotMap[key].dosePerUnit;
                    });

                    const lots = Object.values(lotMap)
                        .filter(l => l.masuk > 0)
                        .sort((a, b) => new Date(a.expireDate) - new Date(b.expireDate));

                    const totalUnits = lots.reduce((sum, l) => sum + l.currentUnits, 0);
                    const totalDoses = lots.reduce((sum, l) => sum + l.currentDoses, 0);
                    
                    return { 
                        ...vax, 
                        lots, 
                        totalUnits, 
                        totalDoses, 
                        isLowStock: totalDoses <= vax.minStock, 
                        nearExpLots: lots.filter(l => l.currentUnits > 0 && Math.ceil((new Date(l.expireDate) - today) / 86400000) <= 30)
                    };
                });
            };

            const calculatedStock = getCalculatedStock();

            // ==========================================
            // KARTU STOK LOGIC
            // ==========================================
            const getStockCardData = () => {
                if (!cardLotId) return null;
                const vaxInfo = calculatedStock.find(v => v.lots.some(l => l.lotId === cardLotId));
                if (!vaxInfo) return null;
                const lotInfo = vaxInfo.lots.find(l => l.lotId === cardLotId);
                
                const rawTxs = transactions.filter(t => t.lotId === cardLotId);
                const uniqueTxs = Array.from(new Map(rawTxs.map(item => [item.id, item])).values());
                const sortedTxs = uniqueTxs.sort((a, b) => new Date(a.date) - new Date(b.date));

                const firstReceipt = sortedTxs.find(t => t.type === 'masuk')?.date || '-';

                let runningBalance = 0;
                const cardRows = sortedTxs.map(tx => {
                    const qty = Number(tx.qty);
                    if (tx.type === 'masuk') runningBalance += qty;
                    else runningBalance -= qty;

                    return {
                        date: tx.date,
                        in: tx.type === 'masuk' ? qty : 0,
                        out: tx.type === 'keluar' ? qty : 0,
                        sourceOrFor: tx.sourceOrFor,
                        balance: runningBalance
                    };
                });

                return {
                    identity: {
                        name: vaxInfo.name, lotId: lotInfo.lotId, batch: lotInfo.batchNo,
                        exp: lotInfo.expireDate, prod: lotInfo.producer, unit: lotInfo.unitName, 
                        dose: lotInfo.dosePerUnit, receiptDate: firstReceipt
                    },
                    rows: cardRows
                };
            };

            const stockCard = getStockCardData();

            // ==========================================
            // NEW FEATURES: EXPORTS
            // ==========================================
            
            // 1. Download Stock Card CSV
            const downloadStockCardCSV = () => {
                if (!stockCard) return;
                
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += `KARTU STOK VAKSIN\r\n`;
                csvContent += `Nama Vaksin,${stockCard.identity.name}\r\n`;
                csvContent += `Lot ID,${stockCard.identity.lotId}\r\n`;
                csvContent += `Batch,${stockCard.identity.batch}\r\n`;
                csvContent += `Kadaluarsa,${stockCard.identity.exp}\r\n`;
                csvContent += `Produsen,${stockCard.identity.prod}\r\n`;
                csvContent += `Satuan,${stockCard.identity.dose} / ${stockCard.identity.unit}\r\n\r\n`;
                csvContent += `Tanggal,Masuk,Keluar,Keterangan,Saldo\r\n`;

                stockCard.rows.forEach(row => {
                    csvContent += `${row.date},${row.in},${row.out},"${row.sourceOrFor}",${row.balance}\r\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `KartuStok_${stockCard.identity.name}_${stockCard.identity.lotId}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('CSV Berhasil diunduh!', 'success');
            };

            // 2. Copy Daily Report to WA/Telegram
            const copyDailyReport = async () => {
                const date = reportDate;
                const filteredTxs = transactions.filter(t => t.date === date);
                
                if (filteredTxs.length === 0) {
                    showToast('Tidak ada transaksi pada tanggal ini');
                    return;
                }

                // Group by Lot ID to get unique batches moved today
                const dailySummary = {};
                filteredTxs.forEach(t => {
                    if (!dailySummary[t.lotId]) {
                        dailySummary[t.lotId] = {
                            name: t.vaccineName,
                            batch: t.batchNo,
                            exp: t.expireDate,
                            in: 0,
                            out: 0
                        };
                    }
                    if (t.type === 'masuk') dailySummary[t.lotId].in += Number(t.qty);
                    else dailySummary[t.lotId].out += Number(t.qty);
                });

                // Format Date for Header
                const d = new Date(date);
                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                const dateStr = d.toLocaleDateString('id-ID', options);

                let reportText = `Transaksi Vaksin\nTanggal ${dateStr}\n\n`;
                
                let index = 1;
                for (const lotId in dailySummary) {
                    const item = dailySummary[lotId];
                    
                    // Calculate current balance for this lot up to this date
                    const balance = transactions
                        .filter(t => t.lotId === lotId && t.date <= date)
                        .reduce((acc, t) => t.type === 'masuk' ? acc + Number(t.qty) : acc - Number(t.qty), 0);

                    reportText += `${index}. Nama Vaksin : ${item.name}\n`;
                    reportText += `No.batch : ${item.batch}\n`;
                    reportText += `Kadaluarsa : ${item.exp}\n`;
                    reportText += `Masuk : ${item.in > 0 ? item.in : '-'}\n`;
                    reportText += `Keluar : ${item.out > 0 ? item.out : '-'}\n`;
                    reportText += `Stok : ${balance}\n\n`;
                    index++;
                }

                try {
                    await navigator.clipboard.writeText(reportText);
                    showToast('Laporan berhasil disalin!', 'success');
                } catch (err) {
                    showToast('Gagal menyalin teks');
                }
            };

            // ==========================================
            // EXISTING LOGICS (Lest maintain the others)
            // ==========================================
            const getExpiredList = () => {
                const today = new Date();
                const allExp = [];
                calculatedStock.forEach(vax => {
                    vax.lots.forEach(lot => {
                        const diff = Math.ceil((new Date(lot.expireDate) - today) / 86400000);
                        if (diff <= 30 && lot.currentUnits > 0) {
                            allExp.push({ ...lot, vaxName: vax.name, daysLeft: diff });
                        }
                    });
                });
                return allExp.sort((a, b) => new Date(a.expireDate) - new Date(b.expireDate));
            };

            const expiredLots = getExpiredList();

            const generateSmartLotId = (vaccine, batchNo, date, currentSessionIds) => {
                const vaxId = vaccine.name.toLowerCase().replace(/\s+/g, '').replace(/vaksin/g, '').trim();
                const existingLot = transactions.find(t => (t.vaccineId === vaxId || t.vaccineName === vaccine.name) && t.batchNo === batchNo && t.type === 'masuk');
                if (existingLot) return existingLot.lotId;
                const usedIdsForThisVax = [...transactions.filter(t => t.type === 'masuk' && t.lotId && t.lotId.startsWith(vaxId)).map(t => t.lotId), ...currentSessionIds.filter(id => id.startsWith(vaxId))];
                let maxNumber = 0;
                usedIdsForThisVax.forEach(id => {
                    const match = id.match(/\d+$/);
                    if (match) {
                        const num = parseInt(match[0], 10);
                        if (num > maxNumber) maxNumber = num;
                    }
                });
                return `${vaxId}${maxNumber + 1}`;
            };

            const downloadTemplate = () => {
                const headers = "Tanggal Masuk,Sumber,Nama Vaksin,Merk,No Batch,Kadaluarsa(YYYY-MM-DD),Dosis,Satuan,Jumlah\n";
                const example = "2023-10-27,Dinkes Kota,BCG,Bio Farma,BCG2026A,2026-12-31,20,Vial,5\n";
                const blob = new Blob([headers + example], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "Template_Vaksin_Masuk.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    const dataRows = lines.slice(1);
                    const previewItems = [];
                    dataRows.forEach((line, i) => {
                        const row = line.split(',');
                        if (row.length >= 9) {
                            previewItems.push({
                                tempId: i, date: superFormatDate(row[0].trim()), source: row[1].trim(), vaxName: row[2].trim(),
                                producer: row[3].trim(), batchNo: row[4].trim(), expireDate: superFormatDate(row[5].trim()),
                                dose: row[6].trim(), unit: row[7].trim(), qty: row[8].trim()
                            });
                        }
                    });
                    if (previewItems.length === 0) showToast('Tidak ada data valid dalam file CSV', 'error');
                    else { setCsvPreviewItems(previewItems); setIsCsvPreviewOpen(true); }
                };
                reader.readAsText(file);
            };

            const confirmCsvImport = async () => {
                setIsSyncing(true);
                const newTxs = [];
                const currentSessionIds = [];
                let errorCount = 0;
                for (let item of csvPreviewItems) {
                    const vax = vaccines.find(v => v.name.toLowerCase() === item.vaxName.toLowerCase());
                    if (!vax) { errorCount++; continue; }
                    const lotId = generateSmartLotId(vax, item.batchNo, item.date, currentSessionIds);
                    currentSessionIds.push(lotId);
                    const transactionData = {
                        id: `TX-CSV-${Date.now()}-${item.tempId}`, vaccineId: vax.id, vaccineName: vax.name, type: 'masuk',
                        date: item.date, sourceOrFor: item.source, lotId: lotId,
                        producer: item.producer, batchNo: item.batchNo, expireDate: item.expireDate,
                        dose: item.dose, unit: item.unit, qty: Number(item.qty), notes: 'Imported via CSV'
                    };
                    await syncToCloud(transactionData);
                    newTxs.push(transactionData);
                }
                if (newTxs.length > 0) {
                    await saveToLocal("transactions", newTxs);
                    setTransactions(mergeUnique(transactions, newTxs));
                }
                setIsCsvPreviewOpen(false);
                setIsSyncing(false);
                if (errorCount > 0) showToast(`${errorCount} vaksin tidak ditemukan di Master`, 'error');
                showToast(`Berhasil mengimpor ${newTxs.length} data!`, 'success');
            };

            const handleAddVaccine = async (e) => {
                e.preventDefault();
                if (!vaxForm.name) return;
                const vaxId = vaxForm.name.toLowerCase().replace(/\s+/g, '');
                const newVax = { id: vaxId, name: vaxForm.name, category: vaxForm.category, minStock: Number(vaxForm.minStock) };
                await syncToCloud({ action: 'addMaster', ...newVax });
                await saveToLocal("master", newVax);
                setVaccines(mergeUnique(vaccines, [newVax]));
                setIsVaxModalOpen(false);
                setVaxForm({ name: '', category: 'Vaksin Wajib', minStock: 10 });
                showToast('Jenis vaksin disimpan!', 'success');
            };

            const handleSaveTransactions = async (e) => {
                e.preventDefault();
                if (!txHeader.date || !txHeader.sourceOrFor) {
                    showToast('Tanggal dan Sumber/Peruntukan harus diisi!');
                    return;
                }
                setIsSyncing(true);
                const newTxs = [];
                const currentSessionIds = [];
                for (let item of txItems) {
                    if (!item.vaccineId || !item.qty) continue;
                    const vax = vaccines.find(v => v.id === item.vaccineId);
                    let lotId, producer = '-', batchNo = '-', expireDate = '-', txId;

                    if (txType === 'masuk') {
                        lotId = generateSmartLotId(vax, item.batchNo, txHeader.date, currentSessionIds);
                        currentSessionIds.push(lotId);
                        txId = `TX-M-${Date.now()}-${Math.floor(Math.random()*1000)}`;
                        producer = item.producer || '-'; batchNo = item.batchNo || '-'; expireDate = item.expireDate || '-';
                    } else {
                        lotId = item.lotId;
                        const exitTxsForLot = transactions.filter(t => t.lotId === lotId && t.type === 'keluar');
                        txId = `${lotId}-${exitTxsForLot.length + 1}`;
                        const sourceTx = transactions.find(t => t.lotId === lotId && t.type === 'masuk');
                        if (sourceTx) { producer = sourceTx.producer; batchNo = sourceTx.batchNo; expireDate = sourceTx.expireDate; }
                    }
                    const transactionData = {
                        id: txId,
                        vaccineId: item.vaccineId, vaccineName: vax ? vax.name : 'Unknown',
                        type: txType, date: txHeader.date, sourceOrFor: txHeader.sourceOrFor,
                        lotId: lotId, producer: producer, batchNo: batchNo, expireDate: expireDate,
                        dose: item.dose || '-', unit: item.unit || 'dosis', qty: Number(item.qty), notes: item.notes || ''
                    };
                    newTxs.push(transactionData);
                    await syncToCloud(transactionData);
                }
                if (newTxs.length === 0) { setIsSyncing(false); showToast('Mohon isi minimal satu jenis vaksin!'); return; }
                await saveToLocal("transactions", newTxs);
                setTransactions(mergeUnique(transactions, newTxs));
                setIsTxModalOpen(false);
                setTxItems([{}]);
                setTxHeader({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
                setIsSyncing(false);
                showToast('Berhasil disimpan & Sync Cloud!', 'success');
            };

            const filteredStock = calculatedStock.filter(v => 
                v.name.toLowerCase().includes(searchQuery.toLowerCase()) && 
                (filterType === 'all' || v.category === filterType)
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-24 md:pb-8">
                    <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl"><Syringe className="w-6 h-6 text-white" /></div>
                                <div className="flex items-center space-x-3">
                                    <div>
                                        <h1 className="font-bold text-lg leading-tight">VaxTrack Cloud</h1>
                                        <p className="text-xs text-emerald-100">Professional Reporting Mode</p>
                                    </div>
                                    <button onClick={() => syncFromCloud()} disabled={isSyncing} className="p-2 bg-white/10 hover:bg-white/20 rounded-full transition" title="Sync Now">
                                        <RefreshCcw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} />
                                    </button>
                                </div>
                            </div>
                            <button onClick={() => setIsTxModalOpen(true)} className="hidden sm:flex items-center space-x-2 bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-xl font-medium text-sm shadow transition">
                                <PlusCircle className="w-4 h-4" />
                                <span>Catat Mutasi</span>
                            </button>
                        </div>
                    </header>

                    {toast && <div className={`fixed top-16 right-4 z-50 p-4 rounded-xl shadow-xl text-white text-xs font-semibold ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>{toast.message}</div>}

                    <main className="max-w-6xl mx-auto px-4 pt-4">
                        <div className="hidden md:flex space-x-2 mb-6 border-b border-slate-200 pb-2">
                            {['stock', 'transactions', 'card', 'expired'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${activeTab === tab ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    {tab === 'stock' && <Package className="w-4 h-4" />}
                                    {tab === 'transactions' && <ArrowLeftRight className="w-4 h-4" />}
                                    {tab === 'card' && <FileText className="w-4 h-4" />}
                                    {tab === 'expired' && <AlertCircle className="w-4 h-4" />}
                                    <span className="capitalize">{tab === 'card' ? 'Kartu Stok' : tab === 'expired' ? 'Lot Kadaluarsa' : tab}</span>
                                </button>
                            ))}
                        </div>

                        {activeTab === 'stock' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row gap-2 justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                                    <div className="relative w-full sm:w-72">
                                        <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                                        <input type="text" placeholder="Cari vaksin..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-2">
                                            <option value="all">Semua Kategori</option>
                                            <option value="Vaksin Wajib">Vaksin Wajib</option>
                                            <option value="Vaksin Pilihan">Vaksin Pilihan</option>
                                        </select>
                                        <button onClick={() => setIsVaxModalOpen(true)} className="bg-emerald-600 text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center space-x-1">
                                            <PlusCircle className="w-3.5 h-3.5" />
                                            <span>Tambah Jenis</span>
                                        </button>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    {filteredStock.map(vax => (
                                        <div key={vax.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                            <div onClick={() => setExpandedVaxId(expandedVaxId === vax.id ? null : vax.id)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50">
                                                <div className="flex items-center space-x-3">
                                                    <div className="bg-emerald-50 text-emerald-700 p-2 rounded-xl"><Package className="w-5 h-5" /></div>
                                                    <div>
                                                        <h3 className="font-bold text-sm">{vax.name}</h3>
                                                        <p className="text-xs text-slate-400">{vax.category}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-4">
                                                    <div className="text-right">
                                                        <span className={`text-lg font-black ${vax.isLowStock ? 'text-amber-600' : 'text-emerald-700'}`}>{vax.totalDoses}</span>
                                                        <span className="text-xs text-slate-400 ml-1">Dosis</span>
                                                        <div className="text-[10px] font-bold text-slate-500">{vax.totalUnits} Satuan</div>
                                                    </div>
                                                    {expandedVaxId === vax.id ? <ChevronUp className="w-5 h-5 text-slate-400" /> : <ChevronDown className="w-5 h-5 text-slate-400" />}
                                                </div>
                                            </div>
                                            {expandedVaxId === vax.id && (
                                                <div className="bg-slate-50 p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                                    {vax.lots.map(lot => (
                                                        <div key={lot.lotId} className={`p-3 rounded-xl bg-white border text-xs ${new Date(lot.expireDate) <= new Date(Date.now() + 30*86400000) ? 'border-rose-300 bg-rose-50' : 'border-slate-200'}`}>
                                                            <div className="flex justify-between mb-1"><span className="font-mono font-bold text-emerald-700">{lot.lotId}</span><span className="text-rose-600 font-bold">{lot.expireDate}</span></div>
                                                            <p className="text-slate-500">Batch: {lot.batchNo}</p>
                                                            <p className="text-slate-500">Produsen: {lot.producer}</p>
                                                            <div className="mt-2 pt-2 border-t flex justify-between items-end font-black">
                                                                <span className="text-slate-400 text-[10px] uppercase">Sisa:</span>
                                                                <div className="text-right">
                                                                    <div className="text-sm text-emerald-700">{lot.currentDoses} Dosis</div>
                                                                    <div className="text-[10px] text-slate-500">{lot.currentUnits} {lot.unitName}</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="space-y-4">
                                {/* EXPORT SECTION */}
                                <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 shadow-sm space-y-3">
                                    <div className="flex items-center space-x-2 text-emerald-700 font-bold text-sm">
                                        <Copy className="w-4 h-4" />
                                        <span>Salin Laporan Harian (WA/Telegram)</span>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <input 
                                            type="date" 
                                            value={reportDate} 
                                            onChange={(e) => setReportDate(e.target.value)} 
                                            className="p-2 bg-white border border-emerald-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none" 
                                        />
                                        <button 
                                            onClick={copyDailyReport} 
                                            className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-emerald-700 transition flex items-center justify-center space-x-2 shadow-sm"
                                        >
                                            <Copy className="w-3.5 h-3.5" />
                                            <span>Salin Teks Laporan</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-100 gap-3">
                                    <h2 className="font-bold">Riwayat Mutasi</h2>
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <button onClick={downloadTemplate} className="flex-1 sm:flex-none bg-slate-100 text-slate-600 text-xs font-semibold px-3 py-2 rounded-xl hover:bg-slate-200 transition flex items-center justify-center space-x-1">
                                            <FileDown className="w-3.5 h-3.5" />
                                            <span>Template CSV</span>
                                        </button>
                                        <button onClick={() => fileInputRef.current.click()} className={`flex-1 sm:flex-none ${isSyncing ? 'bg-slate-300' : 'bg-amber-500'} text-white text-xs font-semibold px-3 py-2 rounded-xl hover:bg-amber-600 transition flex items-center justify-center space-x-1`}>
                                            <FileUp className="w-3.5 h-3.5" />
                                            <span>Upload CSV</span>
                                        </button>
                                        <button onClick={() => setIsTxModalOpen(true)} className="flex-1 sm:flex-none bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-xl hover:bg-emerald-700 transition flex items-center justify-center space-x-1">
                                            <PlusCircle className="w-3.5 h-3.5" />
                                            <span>Tambah</span>
                                        </button>
                                    </div>
                                </div>
                                <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv" className="hidden" />
                                <div className="space-y-2">
                                    {transactions.map(tx => (
                                        <div key={tx.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between gap-3 text-xs">
                                            <div className="flex items-start space-x-3">
                                                <div className={`p-2 rounded-xl ${tx.type === 'masuk' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    {tx.type === 'masuk' ? <TrendingUp className="w-5 h-5" /> : <TrendingDown className="w-5 h-5" />}
                                                </div>
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className="font-bold text-sm">{tx.vaccineName}</span>
                                                        <span className="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-[10px]">{tx.lotId}</span>
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${tx.type === 'masuk' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>{tx.type.toUpperCase()}</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-4 mt-2 text-slate-500">
                                                        <div>Batch: <b className="text-slate-800">{tx.batchNo}</b></div>
                                                        <div>ED: <b className="text-rose-600">{tx.expireDate}</b></div>
                                                        <div>Sumber/Untuk: <b className="text-slate-800">{tx.sourceOrFor}</b></div>
                                                        <div>Jumlah: <b className="text-slate-800">{tx.qty} {tx.unit}</b></div>
                                                    </div>
                                                    <div className="text-slate-400 mt-1">{tx.date}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'card' && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Pilih Vaksin</label>
                                        <select value={cardVaxId} onChange={(e) => { setCardVaxId(e.target.value); setCardLotId(''); }} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                            <option value="">-- Pilih Vaksin --</option>
                                            {vaccines.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Pilih Lot ID</label>
                                        <select value={cardLotId} onChange={(e) => setCardLotId(e.target.value)} disabled={!cardVaxId} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm disabled:bg-slate-100">
                                            <option value="">-- Pilih Lot ID --</option>
                                            {calculatedStock.find(v => v.id === cardVaxId)?.lots.map(l => <option key={l.lotId} value={l.lotId}>{l.lotId} (Batch: {l.batchNo})</option>)}
                                        </select>
                                    </div>
                                </div>

                                {stockCard ? (
                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                        <div className="bg-emerald-600 p-6 text-white">
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1">
                                                    <h2 className="text-2xl font-black uppercase leading-tight">{stockCard.identity.name}</h2>
                                                    <p className="text-emerald-100 text-sm font-medium">Kartu Stok Vaksin</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-xs opacity-80">Lot ID</p>
                                                    <p className="font-mono font-bold text-lg">{stockCard.identity.lotId}</p>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 mt-6 pt-6 border-t border-white/20 text-xs">
                                                <div><p className="opacity-70">Tgl Terima</p><p className="font-bold">{stockCard.identity.receiptDate}</p></div>
                                                <div><p className="opacity-70">No Batch</p><p className="font-bold">{stockCard.identity.batch}</p></div>
                                                <div><p className="opacity-70">Kadaluarsa</p><p className="font-bold">{stockCard.identity.exp}</p></div>
                                                <div><p className="opacity-70">Produsen</p><p className="font-bold">{stockCard.identity.prod}</p></div>
                                                <div><p className="opacity-70">Satuan (Dosis/Unit)</p><p className="font-bold">{stockCard.identity.dose} / {stockCard.identity.unit}</p></div>
                                            </div>
                                        </div>
                                        <div className="p-4 space-y-4">
                                            <div className="flex justify-end">
                                                <button onClick={downloadStockCardCSV} className="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center space-x-2 hover:bg-slate-900 transition shadow-sm">
                                                    <FileDown className="w-3.5 h-3.5" />
                                                    <span>Download CSV Kartu Stok</span>
                                                </button>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-xs border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-100 text-slate-600">
                                                            <th className="p-3 border-b font-bold">Tanggal</th>
                                                            <th className="p-3 border-b font-bold text-center">Masuk</th>
                                                            <th className="p-3 border-b font-bold text-center">Keluar</th>
                                                            <th className="p-3 border-b font-bold">Sumber / Peruntukan</th>
                                                            <th className="p-3 border-b font-bold text-right">Saldo Stok</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {stockCard.rows.map((row, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100">
                                                                <td className="p-3">{row.date}</td>
                                                                <td className="p-3 text-center font-medium text-emerald-600">{row.in > 0 ? row.in : '-'}</td>
                                                                <td className="p-3 text-center font-medium text-rose-600">{row.out > 0 ? row.out : '-'}</td>
                                                                <td className="p-3 text-slate-500">{row.sourceOrFor}</td>
                                                                <td className="p-3 text-right font-black">{row.balance}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
                                        <FileText className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                                        <p className="text-slate-400 text-sm">Silakan pilih vaksin dan lot ID untuk melihat kartu stok.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'expired' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3">
                                    <div className="bg-rose-100 text-rose-600 p-2 rounded-xl"><AlertCircle className="w-5 h-5" /></div>
                                    <div>
                                        <h2 className="font-bold">Lot Hampir/Sudah Kadaluarsa</h2>
                                        <p className="text-xs text-slate-500">Menampilkan lot dengan sisa masa berlaku &lt; 30 hari.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {expiredLots.length === 0 ? (
                                        <div className="col-span-full text-center py-12 bg-white rounded-3xl border border-dashed border-slate-300">
                                            <p className="text-slate-400 text-sm">Tidak ada lot yang mendekati kadaluarsa.</p>
                                        </div>
                                    ) : (
                                        expiredLots.map(lot => (
                                            <div key={lot.lotId} className="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-l-rose-500 border border-slate-100 space-y-3">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <p className="text-[10px] text-slate-400 uppercase font-bold">{lot.vaxName}</p>
                                                        <p className="font-mono font-bold text-emerald-700 text-sm">{lot.lotId}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-rose-600 font-black text-sm">{lot.expireDate}</p>
                                                        <p className={`text-[10px] font-bold ${lot.daysLeft < 0 ? 'text-rose-700' : 'text-amber-600'}`}>
                                                            {lot.daysLeft < 0 ? 'SUDAH EXPIRED' : `${lot.daysLeft} Hari Lagi`}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 bg-slate-50 p-2 rounded-lg">
                                                    <div>Batch: <b className="text-slate-700">{lot.batchNo}</b></div>
                                                    <div className="text-right">Sisa: <b className="text-slate-700">{lot.currentDoses} Dosis</b></div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODALS (TETAP SAMA SEPERTI SEBELUMNYA) */}
                    {isVaxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Tambah Jenis Vaksin</h3>
                                    <button onClick={() => setIsVaxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleAddVaccine} className="space-y-3 text-xs">
                                    <div><label className="block text-slate-600 font-semibold mb-1">Nama Vaksin *</label><input required type="text" value={vaxForm.name} onChange={(e) => setVaxForm({...vaxForm, name: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" placeholder="Contoh: BCG" /></div>
                                    <div><label className="block text-slate-600 font-semibold mb-1">Kategori *</label><select value={vaxForm.category} onChange={(e) => setVaxForm({...vaxForm, category: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"><option value="Vaksin Wajib">Vaksin Wajib</option><option value="Vaksin Pilihan">Vaksin Pilihan</option><option value="Vaksin Khusus">Vaksin Khusus</option></select></div>
                                    <div><label className="block text-slate-600 font-semibold mb-1">Batas Minimum Stok *</label><input required type="number" value={vaxForm.minStock} onChange={(e) => setVaxForm({...vaxForm, minStock: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" /></div>
                                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md">Simpan Master</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isCsvPreviewOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-6xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-lg text-slate-800">Review Data Impor CSV</h3>
                                    <button onClick={() => setIsCsvPreviewOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-6 h-6" /></button>
                                </div>
                                <p className="text-xs text-slate-500 italic">Silakan periksa data di bawah ini sebelum disimpan.</p>
                                <div className="overflow-auto flex-1 border rounded-2xl">
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead className="bg-slate-100 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b">Tanggal</th>
                                                <th className="p-3 border-b">Sumber</th>
                                                <th className="p-3 border-b">Nama Vaksin</th>
                                                <th className="p-3 border-b">Merk</th>
                                                <th className="p-3 border-b">Batch</th>
                                                <th className="p-3 border-b">Exp</th>
                                                <th className="p-3 border-b">Dosis</th>
                                                <th className="p-3 border-b">Satuan</th>
                                                <th className="p-3 border-b">Jumlah</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {csvPreviewItems.map((item, idx) => (
                                                <tr key={item.tempId} className="hover:bg-slate-50">
                                                    <td className="p-2 border-b"><input type="date" value={item.date} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].date = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.source} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].source = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.vaxName} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].vaxName = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded font-bold" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.producer} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].producer = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.batchNo} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].batchNo = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded uppercase" /></td>
                                                    <td className="p-2 border-b"><input type="date" value={item.expireDate} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].expireDate = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.dose} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].dose = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="text" value={item.unit} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].unit = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                    <td className="p-2 border-b"><input type="number" value={item.qty} onChange={(e) => { const n = [...csvPreviewItems]; n[idx].qty = e.target.value; setCsvPreviewItems(n); }} className="w-full p-1 border rounded" /></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="flex justify-end space-x-3 pt-4">
                                    <button onClick={() => setIsCsvPreviewOpen(false)} className="px-6 py-2 bg-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-300 transition">Batal</button>
                                    <button onClick={confirmCsvImport} disabled={isSyncing} className={`px-6 py-2 bg-emerald-600 text-white font-bold rounded-xl shadow-md transition ${isSyncing ? 'bg-slate-400 cursor-not-allowed' : 'hover:bg-emerald-700'}`}>
                                        {isSyncing ? 'Menyimpan...' : 'Konfirmasi & Simpan'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isTxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Catat Mutasi (Batch Entry)</h3>
                                    <button onClick={() => setIsTxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="flex gap-2 mb-4">
                                    <button onClick={() => { setTxType('masuk'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'masuk' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN MASUK</button>
                                    <button onClick={() => { setTxType('keluar'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'keluar' ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN KELUAR</button>
                                </div>
                                <form onSubmit={handleSaveTransactions} className="space-y-4 text-xs">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <div><label className="block font-semibold mb-1">Tanggal *</label><input required type="date" value={txHeader.date} onChange={(e) => setTxHeader({...txHeader, date: e.target.value})} className="w-full p-2 bg-white border rounded-lg" /></div>
                                        <div><label className="block font-semibold mb-1">{txType === 'masuk' ? 'Sumber Vaksin *' : 'Peruntukan *'}</label><input required type="text" value={txHeader.sourceOrFor} onChange={(e) => setTxHeader({...txHeader, sourceOrFor: e.target.value})} className="w-full p-2 bg-white border rounded-lg" placeholder="Contoh: Dinkes / Puskesmas A" /></div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead><tr className="text-slate-500"><th className="p-2 border-b">Vaksin</th>{txType === 'masuk' ? (<><th className="p-2 border-b">Merk</th><th className="p-2 border-b">Batch</th><th className="p-2 border-b">Kadaluarsa</th><th className="p-2 border-b">Dosis</th><th className="p-2 border-b">Satuan</th></>) : (<th className="p-2 border-b">ID Masuk (Lot ID)</th>)}<th className="p-2 border-b">Jumlah</th><th className="p-2 border-b w-10"></th></tr></thead>
                                            <tbody>
                                                {txItems.map((item, idx) => (
                                                    <tr key={idx}>
                                                        <td className="p-2 border-b"><select required value={item.vaccineId} onChange={(e) => { const n = [...txItems]; n[idx].vaccineId = e.target.value; setTxItems(n); }} className="w-full p-1.5 bg-slate-50 border rounded">
                                                            <option value="">-- Pilih --</option>
                                                            {vaccines.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                                        </select></td>
                                                        {txType === 'masuk' ? (
                                                            <>
                                                                <td className="p-2 border-b"><input type="text" value={item.producer} onChange={(e) => { const n = [...txItems]; n[idx].producer = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.batchNo} onChange={(e) => { const n = [...txItems]; n[idx].batchNo = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded uppercase" /></td>
                                                                <td className="p-2 border-b"><input type="date" value={item.expireDate} onChange={(e) => { const n = [...txItems]; n[idx].expireDate = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.dose} onChange={(e) => { const n = [...txItems]; n[idx].dose = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" placeholder="20" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.unit} onChange={(e) => { const n = [...txItems]; n[idx].unit = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" placeholder="Vial" /></td>
                                                            </>
                                                        ) : (
                                                            <td className="p-2 border-b"><select required value={item.lotId} onChange={(e) => { const n = [...txItems]; n[idx].lotId = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded">
                                                                <option value="">-- Pilih ID Masuk --</option>
                                                                {calculatedStock.find(v => v.id === item.vaccineId)?.lots.filter(l => l.currentUnits > 0).map(l => <option key={l.lotId} value={l.lotId}>{l.lotId} (Sisa: {l.currentUnits} {l.unitName})</option>)}
                                                            </select></td>
                                                        )}
                                                        <td className="p-2 border-b"><input required type="number" value={item.qty} onChange={(e) => { const n = [...txItems]; n[idx].qty = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                        <td className="p-2 border-b text-center"><button type="button" onClick={() => { const n = [...txItems]; n.splice(idx,1); setTxItems(n.length ? n : [{}]); }} className="text-rose-400"><Trash2 className="w-4 h-4" /></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <button type="button" onClick={() => setTxItems([...txItems, {}])} className="flex items-center space-x-1 text-emerald-600 font-bold py-2 px-4 rounded-lg border border-emerald-600 hover:bg-emerald-50 transition"><PlusCircle className="w-4 h-4" /><span>Tambah Baris</span></button>
                                    <button type="submit" disabled={isSyncing} className={`w-full py-3 text-white font-bold rounded-xl shadow-md transition ${isSyncing ? 'bg-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                        {isSyncing ? 'Sedang Mengirim Data...' : 'Simpan & Sync Cloud'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center md:hidden z-30 shadow-lg">
                        <button onClick={() => setActiveTab('stock')} className={`flex flex-col items-center space-y-1 ${activeTab === 'stock' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><Package className="w-5 h-5" /><span className="text-[10px]">Stok</span></button>
                        <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><ArrowLeftRight className="w-5 h-5" /><span className="text-[10px]">Transaksi</span></button>
                        <button onClick={() => setActiveTab('card')} className={`flex flex-col items-center space-y-1 ${activeTab === 'card' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><FileText className="w-5 h-5" /><span className="text-[10px]">Kartu Stok</span></button>
                        <button onClick={() => setActiveTab('expired')} className={`flex flex-col items-center space-y-1 ${activeTab === 'expired' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><AlertCircle className="w-5 h-5" /><span className="text-[10px]">Expired</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
