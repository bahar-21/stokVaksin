<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaxTrack Lot System - Manajemen Stok Vaksin</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#059669">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const LayoutDashboard = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>);
        const Package = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>);
        const ArrowLeftRight = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>);
        const PlusCircle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>);
        const Download = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
        const AlertTriangle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>);
        const Search = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
        const TrendingUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>);
        const TrendingDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>);
        const Syringe = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>);
        const Trash2 = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
        const X = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const ChevronDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>);
        const ChevronUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>);
        const Tag = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 2H2v10l11.29 11.29a1 1 0 0 0 1.41 0l7.29-7.29a1 1 0 0 0 0-1.41L12 2z"/><path d="M7 7h.01"/></svg>);

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            // State Master & Transaksi
            const [vaccines, setVaccines] = useState(() => {
                const saved = localStorage.getItem('vax_master_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('vax_tx_v2');
                return saved ? JSON.parse(saved) : [];
            });

            // UI State
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isVaxModalOpen, setIsVaxModalOpen] = useState(false);
            const [expandedVaxId, setExpandedVaxId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterType, setFilterType] = useState('all');

            // Master Vaksin Form
            const [vaxForm, setVaxForm] = useState({ name: '', category: 'Vaksin Wajib', minStock: 10 });

            // Transaksi Form (Dynamic Batch)
            const [txType, setTxType] = useState('masuk');
            const [txHeader, setTxHeader] = useState({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
            const [txItems, setTxItems] = useState([{}]);

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => { localStorage.setItem('vax_master_v2', JSON.stringify(vaccines)); }, [vaccines]);
            useEffect(() => { localStorage.setItem('vax_tx_v2', JSON.stringify(transactions)); }, [transactions]);

            // Kalkulasi Stok & Lot
            const getCalculatedStock = () => {
                const today = new Date();
                return vaccines.map((vax) => {
                    const vaxTxs = transactions.filter(t => t.vaccineId === vax.id);
                    const lotMap = {};

                    vaxTxs.forEach((tx) => {
                        const key = tx.lotId || tx.batchNo;
                        if (!lotMap[key]) {
                            lotMap[key] = { lotId: key, batchNo: tx.batchNo, expireDate: tx.expireDate, producer: tx.producer, masuk: 0, keluar: 0, currentStock: 0 };
                        }
                        if (tx.type === 'masuk') lotMap[key].masuk += Number(tx.qty);
                        else lotMap[key].keluar += Number(tx.qty);
                        lotMap[key].currentStock = lotMap[key].masuk - lotMap[key].keluar;
                    });

                    const lots = Object.values(lotMap).filter(l => l.masuk > 0).sort((a, b) => new Date(a.expireDate) - new Date(b.expireDate));
                    const currentStock = lots.reduce((sum, l) => sum + l.currentStock, 0);

                    const nearExpLots = lots.filter(l => {
                        if (l.currentStock <= 0) return false;
                        const exp = new Date(l.expireDate);
                        return Math.ceil((exp - today) / (1000 * 60 * 60 * 24)) <= 30;
                    });

                    return { ...vax, lots, currentStock, isLowStock: currentStock <= vax.minStock, nearExpLots };
                });
            };

            const calculatedStock = getCalculatedStock();

            const handleAddVaccine = (e) => {
                e.preventDefault();
                if (!vaxForm.name) return;
                const newVax = { id: 'V-' + Date.now(), name: vaxForm.name, category: vaxForm.category, minStock: Number(vaxForm.minStock) };
                setVaccines([...vaccines, newVax]);
                setIsVaxModalOpen(false);
                setVaxForm({ name: '', category: 'Vaksin Wajib', minStock: 10 });
                showToast('Jenis vaksin berhasil ditambahkan!', 'success');
            };

            const handleAddItem = () => setTxItems([...txItems, {}]);
            const handleRemoveItem = (index) => {
                const newItems = [...txItems];
                newItems.splice(index, 1);
                setTxItems(newItems.length ? newItems : [{}]);
            };

            const handleItemChange = (index, field, value) => {
                const newItems = [...txItems];
                newItems[index] = { ...newItems[index], [field]: value };
                setTxItems(newItems);
            };

            const handleSaveTransactions = (e) => {
                e.preventDefault();
                if (!txHeader.date || !txHeader.sourceOrFor) {
                    showToast('Tanggal dan Sumber/Peruntukan harus diisi!');
                    return;
                }

                const newTxs = [];
                for (let item of txItems) {
                    if (!item.vaccineId || !item.qty) continue;

                    const vax = vaccines.find(v => v.id === item.vaccineId);
                    const lotId = txType === 'masuk' ? (item.batchNo || 'LOT-GEN') : item.lotId;

                    newTxs.push({
                        id: `TX-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
                        vaccineId: item.vaccineId,
                        vaccineName: vax ? vax.name : 'Unknown',
                        type: txType,
                        date: txHeader.date,
                        sourceOrFor: txHeader.sourceOrFor,
                        lotId: lotId,
                        producer: item.producer || '-',
                        batchNo: item.batchNo || '-',
                        expireDate: item.expireDate || '-',
                        dose: item.dose || '-',
                        unit: item.unit || 'dosis',
                        qty: Number(item.qty),
                        notes: item.notes || ''
                    });
                }

                if (newTxs.length === 0) {
                    showToast('Mohon isi minimal satu jenis vaksin!');
                    return;
                }

                setTransactions([...newTxs, ...transactions]);
                setIsTxModalOpen(false);
                setTxItems([{}]);
                setTxHeader({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
                showToast('Transaksi berhasil disimpan!', 'success');
            };

            const handleDeleteTx = (id) => {
                setConfirmModal({
                    message: 'Hapus transaksi ini?',
                    onConfirm: () => {
                        setTransactions(transactions.filter(t => t.id !== id));
                        setConfirmModal(null);
                        showToast('Dihapus', 'success');
                    }
                });
            };

            const downloadCSV = () => {
                let csv = "ID,Tanggal,Tipe,Vaksin,Lot/Batch,Sumber/Untuk,Jumlah,Satuan,Kadaluarsa\n";
                transactions.forEach(t => {
                    csv += `${t.id},${t.date},${t.type},${t.vaccineName},${t.lotId},${t.sourceOrFor},${t.qty},${t.unit},${t.expireDate}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', `Laporan_Vaksin_${new Date().toISOString().split('T')[0]}.csv`);
                a.click();
            };

            const filteredStock = calculatedStock.filter(v => 
                v.name.toLowerCase().includes(searchQuery.toLowerCase()) && 
                (filterType === 'all' || v.category === filterType)
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-24 md:pb-8">
                    <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                                    <Syringe className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">VaxTrack v2</h1>
                                    <p className="text-xs text-emerald-100">Manajemen Stok Vaksin</p>
                                </div>
                            </div>
                            <button onClick={() => setIsTxModalOpen(true)} className="hidden sm:flex items-center space-x-2 bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-xl font-medium text-sm shadow transition">
                                <PlusCircle className="w-4 h-4" />
                                <span>Catat Mutasi</span>
                            </button>
                        </div>
                    </header>

                    {toast && <div className={`fixed top-16 right-4 z-50 p-4 rounded-xl shadow-xl text-white text-xs font-semibold ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>{toast.message}</div>}

                    {confirmModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-2xl space-y-4 text-center">
                                <AlertTriangle className="w-10 h-10 text-amber-500 mx-auto" />
                                <p className="text-sm font-semibold text-slate-700">{confirmModal.message}</p>
                                <div className="flex space-x-2">
                                    <button onClick={() => setConfirmModal(null)} className="flex-1 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-xl">Batal</button>
                                    <button onClick={confirmModal.onConfirm} className="flex-1 py-2 bg-rose-600 text-white text-xs font-bold rounded-xl shadow">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-6xl mx-auto px-4 pt-4">
                        <div className="hidden md:flex space-x-2 mb-6 border-b border-slate-200 pb-2">
                            {['dashboard', 'stock', 'transactions', 'export'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${activeTab === tab ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    {tab === 'dashboard' && <LayoutDashboard className="w-4 h-4" />}
                                    {tab === 'stock' && <Package className="w-4 h-4" />}
                                    {tab === 'transactions' && <ArrowLeftRight className="w-4 h-4" />}
                                    {tab === 'export' && <Download className="w-4 h-4" />}
                                    <span className="capitalize">{tab}</span>
                                </button>
                            ))}
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Total Stok</span>
                                        <div className="mt-2 text-2xl font-extrabold">{calculatedStock.reduce((a, b) => a + b.currentStock, 0)} <span className="text-xs font-normal text-slate-500">Dosis</span></div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                        <span className="text-xs font-semibold text-slate-400 uppercase">Jenis Vaksin</span>
                                        <div className="mt-2 text-2xl font-extrabold text-emerald-600">{vaccines.length} <span className="text-xs font-normal text-slate-500">Item</span></div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                        <span className="text-xs font-semibold text-amber-500 uppercase">Stok Menipis</span>
                                        <div className="mt-2 text-2xl font-extrabold text-amber-600">{calculatedStock.filter(v => v.isLowStock).length} <span className="text-xs font-normal text-amber-600">Item</span></div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                        <span className="text-xs font-semibold text-rose-500 uppercase">Kadaluarsa</span>
                                        <div className="mt-2 text-2xl font-extrabold text-rose-600">{calculatedStock.reduce((sum, v) => sum + v.nearExpLots.length, 0)} <span className="text-xs font-normal text-rose-600">Lot</span></div>
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                                    <h2 className="font-bold text-slate-800 mb-4">Ringkasan Stok</h2>
                                    <div className="divide-y divide-slate-100">
                                        {calculatedStock.map(vax => (
                                            <div key={vax.id} className="py-3 flex justify-between items-center text-sm">
                                                <div>
                                                    <p className="font-semibold">{vax.name}</p>
                                                    <p className="text-xs text-slate-400">{vax.category}</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className={`font-black text-base ${vax.isLowStock ? 'text-amber-600' : 'text-emerald-700'}`}>{vax.currentStock}</span>
                                                    <span className="text-xs text-slate-400 ml-1">Dosis</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'stock' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row gap-2 justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                                    <div className="relative w-full sm:w-72">
                                        <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                                        <input type="text" placeholder="Cari vaksin..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-2">
                                            <option value="all">Semua Kategori</option>
                                            <option value="Vaksin Wajib">Vaksin Wajib</option>
                                            <option value="Vaksin Pilihan">Vaksin Pilihan</option>
                                        </select>
                                        <button onClick={() => setIsVaxModalOpen(true)} className="bg-emerald-600 text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center space-x-1 whitespace-nowrap">
                                            <PlusCircle className="w-3.5 h-3.5" />
                                            <span>Tambah Jenis</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {filteredStock.map(vax => (
                                        <div key={vax.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                            <div onClick={() => setExpandedVaxId(expandedVaxId === vax.id ? null : vax.id)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50">
                                                <div className="flex items-center space-x-3">
                                                    <div className="bg-emerald-50 text-emerald-700 p-2 rounded-xl"><Package className="w-5 h-5" /></div>
                                                    <div>
                                                        <h3 className="font-bold text-sm">{vax.name}</h3>
                                                        <p className="text-xs text-slate-400">{vax.category}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-4">
                                                    <div className="text-right">
                                                        <span className={`text-lg font-black ${vax.isLowStock ? 'text-amber-600' : 'text-emerald-700'}`}>{vax.currentStock}</span>
                                                        <span className="text-xs text-slate-400 ml-1">Dosis</span>
                                                    </div>
                                                    {expandedVaxId === vax.id ? <ChevronUp className="w-5 h-5 text-slate-400" /> : <ChevronDown className="w-5 h-5 text-slate-400" />}
                                                </div>
                                            </div>
                                            {expandedVaxId === vax.id && (
                                                <div className="bg-slate-50 p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                                    {vax.lots.map(lot => (
                                                        <div key={lot.lotId} className={`p-3 rounded-xl bg-white border text-xs ${new Date(lot.expireDate) <= new Date(Date.now() + 30*86400000) ? 'border-rose-300 bg-rose-50' : 'border-slate-200'}`}>
                                                            <div className="flex justify-between mb-1">
                                                                <span className="font-mono font-bold text-emerald-700">{lot.lotId}</span>
                                                                <span className="text-rose-600 font-bold">{lot.expireDate}</span>
                                                            </div>
                                                            <p className="text-slate-500">Batch: {lot.batchNo}</p>
                                                            <p className="text-slate-500">Produsen: {lot.producer}</p>
                                                            <div className="mt-2 pt-2 border-t text-right font-black text-sm">{lot.currentStock} Dosis</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                                    <h2 className="font-bold">Riwayat Transaksi</h2>
                                    <button onClick={() => setIsTxModalOpen(true)} className="bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center space-x-1">
                                        <PlusCircle className="w-3.5 h-3.5" />
                                        <span>Tambah</span>
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {transactions.map(tx => (
                                        <div key={tx.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between gap-3 text-xs">
                                            <div className="flex items-start space-x-3">
                                                <div className={`p-2 rounded-xl ${tx.type === 'masuk' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    {tx.type === 'masuk' ? <TrendingUp className="w-5 h-5" /> : <TrendingDown className="w-5 h-5" />}
                                                </div>
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className="font-bold text-sm">{tx.vaccineName}</span>
                                                        <span className="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-[10px]">{tx.lotId}</span>
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${tx.type === 'masuk' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>{tx.type.toUpperCase()}</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-4 mt-2 text-slate-500">
                                                        <div>Batch: <b className="text-slate-800">{tx.batchNo}</b></div>
                                                        <div>ED: <b className="text-rose-600">{tx.expireDate}</b></div>
                                                        <div>Sumber/Untuk: <b>{tx.sourceOrFor}</b></div>
                                                        <div>Jumlah: <b>{tx.qty} {tx.unit}</b></div>
                                                    </div>
                                                    <div className="text-slate-400 mt-1">{tx.date}</div>
                                                </div>
                                            </div>
                                            <button onClick={() => handleDeleteTx(tx.id)} className="text-slate-300 hover:text-rose-600 p-1 transition"><Trash2 className="w-4 h-4" /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'export' && (
                            <div className="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4 text-center">
                                <h2 className="font-bold text-lg">Export Data</h2>
                                <p className="text-sm text-slate-500">Unduh seluruh riwayat mutasi vaksin ke format CSV.</p>
                                <button onClick={downloadCSV} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition flex items-center justify-center space-x-2">
                                    <Download className="w-5 h-5" />
                                    <span>Download CSV Report</span>
                                </button>
                            </div>
                        )}
                    </main>

                    {/* MODAL: TAMBAH JENIS VAKSIN */}
                    {isVaxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Tambah Jenis Vaksin</h3>
                                    <button onClick={() => setIsVaxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleAddVaccine} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Nama Vaksin *</label>
                                        <input required type="text" value={vaxForm.name} onChange={(e) => setVaxForm({...vaxForm, name: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" placeholder="Contoh: BCG" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Kategori *</label>
                                        <select value={vaxForm.category} onChange={(e) => setVaxForm({...vaxForm, category: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                                            <option value="Vaksin Wajib">Vaksin Wajib</option>
                                            <option value="Vaksin Pilihan">Vaksin Pilihan</option>
                                            <option value="Vaksin Khusus">Vaksin Khusus</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Batas Minimum Stok *</label>
                                        <input required type="number" value={vaxForm.minStock} onChange={(e) => setVaxForm({...vaxForm, minStock: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md">Simpan Jenis Vaksin</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: TRANSAKSI BATCH */}
                    {isTxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Pencatatan Mutasi Vaksin</h3>
                                    <button onClick={() => setIsTxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>

                                <div className="flex gap-2 mb-4">
                                    <button onClick={() => { setTxType('masuk'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'masuk' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN MASUK</button>
                                    <button onClick={() => { setTxType('keluar'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'keluar' ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN KELUAR</button>
                                </div>

                                <form onSubmit={handleSaveTransactions} className="space-y-4 text-xs">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <div>
                                            <label className="block font-semibold mb-1">Tanggal Mutasi *</label>
                                            <input required type="date" value={txHeader.date} onChange={(e) => setTxHeader({...txHeader, date: e.target.value})} className="w-full p-2 bg-white border rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1">{txType === 'masuk' ? 'Sumber Vaksin *' : 'Peruntukan/Tujuan *'}</label>
                                            <input required type="text" value={txHeader.sourceOrFor} onChange={(e) => setTxHeader({...txHeader, sourceOrFor: e.target.value})} className="w-full p-2 bg-white border rounded-lg" placeholder={txType === 'masuk' ? 'Contoh: Dinkes Kota' : 'Contoh: Puskesmas A'} />
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="text-slate-500">
                                                    <th className="p-2 border-b">Vaksin</th>
                                                    {txType === 'masuk' ? (
                                                        <>
                                                            <th className="p-2 border-b">Merk/Produsen</th>
                                                            <th className="p-2 border-b">No. Batch</th>
                                                            <th className="p-2 border-b">Kadaluarsa</th>
                                                            <th className="p-2 border-b">Dosis</th>
                                                            <th className="p-2 border-b">Satuan</th>
                                                        </>
                                                    ) : (
                                                        <th className="p-2 border-b">Lot ID (FEFO)</th>
                                                    )}
                                                    <th className="p-2 border-b">Jumlah</th>
                                                    <th className="p-2 border-b w-10"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {txItems.map((item, idx) => (
                                                    <tr key={idx} className="group">
                                                        <td className="p-2 border-b">
                                                            <select required value={item.vaccineId} onChange={(e) => handleItemChange(idx, 'vaccineId', e.target.value)} className="w-full p-1.5 bg-slate-50 border rounded">
                                                                <option value="">-- Pilih --</option>
                                                                {vaccines.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                                            </select>
                                                        </td>
                                                        {txType === 'masuk' ? (
                                                            <>
                                                                <td className="p-2 border-b"><input type="text" value={item.producer} onChange={(e) => handleItemChange(idx, 'producer', e.target.value)} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.batchNo} onChange={(e) => handleItemChange(idx, 'batchNo', e.target.value)} className="w-full p-1.5 border rounded uppercase" /></td>
                                                                <td className="p-2 border-b"><input type="date" value={item.expireDate} onChange={(e) => handleItemChange(idx, 'expireDate', e.target.value)} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.dose} onChange={(e) => handleItemChange(idx, 'dose', e.target.value)} className="w-full p-1.5 border rounded" placeholder="0.5ml" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.unit} onChange={(e) => handleItemChange(idx, 'unit', e.target.value)} className="w-full p-1.5 border rounded" placeholder="Dosis" /></td>
                                                            </>
                                                        ) : (
                                                            <td className="p-2 border-b">
                                                                <select required value={item.lotId} onChange={(e) => handleItemChange(idx, 'lotId', e.target.value)} className="w-full p-1.5 border rounded">
                                                                    <option value="">-- Pilih Lot --</option>
                                                                    {calculatedStock.find(v => v.id === item.vaccineId)?.lots.filter(l => l.currentStock > 0).map(l => (
                                                                        <option key={l.lotId} value={l.lotId}>{l.lotId} (Sisa: {l.currentStock})</option>
                                                                    ))}
                                                                </select>
                                                            </td>
                                                        )}
                                                        <td className="p-2 border-b">
                                                            <input required type="number" value={item.qty} onChange={(e) => handleItemChange(idx, 'qty', e.target.value)} className="w-full p-1.5 border rounded" />
                                                        </td>
                                                        <td className="p-2 border-b text-center">
                                                            <button type="button" onClick={() => handleRemoveItem(idx)} className="text-rose-400 hover:text-rose-600"><Trash2 className="w-4 h-4" /></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <button type="button" onClick={handleAddItem} className="flex items-center space-x-1 text-emerald-600 font-bold py-2 px-4 rounded-lg border border-emerald-600 hover:bg-emerald-50 transition">
                                        <PlusCircle className="w-4 h-4" />
                                        <span>Tambah Baris Vaksin</span>
                                    </button>
                                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition">Simpan Semua Mutasi</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MOBILE NAV */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center md:hidden z-30 shadow-lg">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><LayoutDashboard className="w-5 h-5" /><span className="text-[10px]">Dashboard</span></button>
                        <button onClick={() => setActiveTab('stock')} className={`flex flex-col items-center space-y-1 ${activeTab === 'stock' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><Package className="w-5 h-5" /><span className="text-[10px]">Stok & Lot</span></button>
                        <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><ArrowLeftRight className="w-5 h-5" /><span className="text-[10px]">Transaksi</span></button>
                        <button onClick={() => setActiveTab('export')} className={`flex flex-col items-center space-y-1 ${activeTab === 'export' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><Download className="w-5 h-5" /><span className="text-[10px]">CSV</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
