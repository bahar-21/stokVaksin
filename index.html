<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaxTrack Lot System - Manajemen Stok Vaksin</title>
    
    <!-- PWA / Mobile Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#059669">

    <!-- Tailwind CSS & React Dependencies CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Inline SVG Icons (Replacing Lucide Icons for Standalone Execution)
        const LayoutDashboard = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        );
        const Package = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        );
        const ArrowLeftRight = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
        );
        const PlusCircle = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        );
        const Download = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const AlertTriangle = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
        );
        const Search = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const TrendingUp = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const TrendingDown = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        );
        const Syringe = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>
        );
        const Trash2 = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        );
        const X = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const ChevronDown = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        );
        const ChevronUp = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
        );
        const Tag = ({ className="w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 2H2v10l11.29 11.29a1 1 0 0 0 1.41 0l7.29-7.29a1 1 0 0 0 0-1.41L12 2z"/><path d="M7 7h.01"/></svg>
        );

        // Sample Data Awal Master Vaksin
        const initialVaccines = [
            { id: '1', name: 'BCG', type: 'Vaksin Wajib', producer: 'Bio Farma', minStock: 20 },
            { id: '2', name: 'MR (Measles Rubella)', type: 'Vaksin Wajib', producer: 'Serum Institute of India (SII)', minStock: 15 },
            { id: '3', name: 'DPT-HB-Hib', type: 'Vaksin Wajib', producer: 'Bio Farma', minStock: 30 },
            { id: '4', name: 'Hepatitis B Recombinant', type: 'Vaksin Wajib', producer: 'Bio Farma', minStock: 25 },
        ];

        // Sample Transaksi Awal dengan Lot ID (Internal Tracking ID)
        const initialTransactions = [
            {
                id: 'TX-1001',
                vaccineId: '1',
                vaccineName: 'BCG',
                lotId: 'BCG-LOT-01',
                type: 'masuk',
                dose: '0.05 ml',
                batchNo: 'BCG-2026-A1',
                expireDate: '2026-09-15',
                producer: 'Bio Farma',
                qty: 30,
                date: '2026-07-10',
                notes: 'Penerimaan Dinkes Tahap 1'
            },
            {
                id: 'TX-1002',
                vaccineId: '1',
                vaccineName: 'BCG',
                lotId: 'BCG-LOT-02',
                type: 'masuk',
                dose: '0.05 ml',
                batchNo: 'BCG-2026-B2',
                expireDate: '2027-02-20',
                producer: 'Bio Farma',
                qty: 50,
                date: '2026-08-01',
                notes: 'Penerimaan Dinkes Tahap 2'
            },
            {
                id: 'TX-1003',
                vaccineId: '1',
                vaccineName: 'BCG',
                lotId: 'BCG-LOT-01',
                type: 'keluar',
                dose: '0.05 ml',
                batchNo: 'BCG-2026-A1',
                expireDate: '2026-09-15',
                producer: 'Bio Farma',
                qty: 10,
                date: '2026-08-15',
                notes: 'Imunisasi Bayi Puskesmas'
            },
            {
                id: 'TX-1004',
                vaccineId: '2',
                vaccineName: 'MR (Measles Rubella)',
                lotId: 'MR-LOT-01',
                type: 'masuk',
                dose: '0.5 ml',
                batchNo: 'MR-SII-882',
                expireDate: '2026-11-30',
                producer: 'Serum Institute of India (SII)',
                qty: 40,
                date: '2026-08-05',
                notes: 'Stok Rutin Posyandu'
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Notification & Confirmation Modal State
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            // State Master & Transaksi
            const [vaccines, setVaccines] = useState(() => {
                const saved = localStorage.getItem('vax_master_lot');
                return saved ? JSON.parse(saved) : initialVaccines;
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('vax_tx_lot');
                return saved ? JSON.parse(saved) : initialTransactions;
            });

            // State UI & Filter
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isVaxModalOpen, setIsVaxModalOpen] = useState(false);
            const [expandedVaxId, setExpandedVaxId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterType, setFilterType] = useState('all');

            // Form State
            const [txForm, setTxForm] = useState({
                vaccineId: '',
                type: 'masuk',
                lotId: '',
                dose: '0.5 ml',
                batchNo: '',
                expireDate: '',
                producer: '',
                qty: '',
                notes: ''
            });

            const [vaxForm, setVaxForm] = useState({
                name: '',
                type: 'Vaksin Wajib',
                producer: 'Bio Farma',
                minStock: 10
            });

            // Auto Dismiss Toast
            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Sync LocalStorage
            useEffect(() => {
                localStorage.setItem('vax_master_lot', JSON.stringify(vaccines));
            }, [vaccines]);

            useEffect(() => {
                localStorage.setItem('vax_tx_lot', JSON.stringify(transactions));
            }, [transactions]);

            const getCalculatedStock = () => {
                const today = new Date();

                return vaccines.map((vax) => {
                    const vaxTxs = transactions.filter(t => t.vaccineId === vax.id);
                    
                    const lotMap = {};

                    vaxTxs.forEach((tx) => {
                        const key = tx.lotId || `${tx.batchNo}`;
                        if (!lotMap[key]) {
                            lotMap[key] = {
                                lotId: key,
                                batchNo: tx.batchNo,
                                expireDate: tx.expireDate,
                                producer: tx.producer || vax.producer,
                                masuk: 0,
                                keluar: 0,
                                currentStock: 0
                            };
                        }

                        if (tx.type === 'masuk') {
                            lotMap[key].masuk += Number(tx.qty);
                        } else {
                            lotMap[key].keluar += Number(tx.qty);
                        }
                        
                        lotMap[key].currentStock = lotMap[key].masuk - lotMap[key].keluar;
                    });

                    const lots = Object.values(lotMap)
                        .filter(l => l.currentStock > 0 || l.masuk > 0)
                        .sort((a, b) => new Date(a.expireDate) - new Date(b.expireDate));

                    const totalMasuk = lots.reduce((sum, l) => sum + l.masuk, 0);
                    const totalKeluar = lots.reduce((sum, l) => sum + l.keluar, 0);
                    const currentStock = totalMasuk - totalKeluar;

                    const nearExpLots = lots.filter(l => {
                        if (l.currentStock <= 0) return false;
                        const exp = new Date(l.expireDate);
                        const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
                        return diffDays <= 30;
                    });

                    return {
                        ...vax,
                        lots,
                        totalMasuk,
                        totalKeluar,
                        currentStock,
                        isLowStock: currentStock <= (vax.minStock || 10),
                        nearExpLots
                    };
                });
            };

            const calculatedStock = getCalculatedStock();

            const selectedVaxStockInfo = txForm.vaccineId 
                ? calculatedStock.find(s => s.id === txForm.vaccineId)
                : null;

            const availableLotsForKeluar = selectedVaxStockInfo
                ? selectedVaxStockInfo.lots.filter(l => l.currentStock > 0)
                : [];

            const handleVaccineSelection = (vaxId) => {
                const vax = vaccines.find(v => v.id === vaxId);
                setTxForm(prev => ({
                    ...prev,
                    vaccineId: vaxId,
                    producer: vax ? vax.producer : '',
                    lotId: '',
                    batchNo: '',
                    expireDate: ''
                }));
            };

            const handleLotSelectionForKeluar = (lotId) => {
                const lot = availableLotsForKeluar.find(l => l.lotId === lotId);
                if (lot) {
                    setTxForm(prev => ({
                        ...prev,
                        lotId: lot.lotId,
                        batchNo: lot.batchNo,
                        expireDate: lot.expireDate,
                        producer: lot.producer
                    }));
                } else {
                    setTxForm(prev => ({
                        ...prev,
                        lotId: '',
                        batchNo: '',
                        expireDate: ''
                    }));
                }
            };

            const handleAddTransaction = (e) => {
                e.preventDefault();

                if (!txForm.vaccineId || !txForm.qty || !txForm.batchNo || !txForm.expireDate) {
                    showToast('Mohon lengkapi seluruh field berbintang (*)', 'error');
                    return;
                }

                const selectedVax = vaccines.find(v => v.id === txForm.vaccineId);

                let finalLotId = txForm.lotId;
                if (txForm.type === 'masuk' && !finalLotId) {
                    const existingLotsCount = selectedVaxStockInfo ? selectedVaxStockInfo.lots.length : 0;
                    finalLotId = `${selectedVax ? selectedVax.name.replace(/\s+/g, '').toUpperCase() : 'VAX'}-LOT-0${existingLotsCount + 1}`;
                }

                if (txForm.type === 'keluar') {
                    const targetLot = availableLotsForKeluar.find(l => l.lotId === txForm.lotId);
                    const maxAvailable = targetLot ? targetLot.currentStock : 0;

                    if (Number(txForm.qty) > maxAvailable) {
                        showToast(`Stok tidak mencukupi untuk Lot ID [${txForm.lotId}]! Sisa stok aktif lot ini: ${maxAvailable} dosis.`, 'error');
                        return;
                    }
                }

                const newTx = {
                    id: `TX-${Date.now().toString().slice(-5)}`,
                    vaccineId: txForm.vaccineId,
                    vaccineName: selectedVax ? selectedVax.name : 'Unknown',
                    lotId: finalLotId,
                    type: txForm.type,
                    dose: txForm.dose || '0.5 ml',
                    batchNo: txForm.batchNo.trim().toUpperCase(),
                    expireDate: txForm.expireDate,
                    producer: txForm.producer || selectedVax?.producer || '-',
                    qty: Number(txForm.qty),
                    date: new Date().toISOString().split('T')[0],
                    notes: txForm.notes
                };

                setTransactions([newTx, ...transactions]);
                setIsTxModalOpen(false);
                showToast('Transaksi berhasil disimpan!', 'success');
                
                setTxForm({
                    vaccineId: '',
                    type: 'masuk',
                    lotId: '',
                    dose: '0.5 ml',
                    batchNo: '',
                    expireDate: '',
                    producer: '',
                    qty: '',
                    notes: ''
                });
            };

            const handleAddVaccine = (e) => {
                e.preventDefault();
                if (!vaxForm.name) return;

                const newVax = {
                    id: Date.now().toString(),
                    name: vaxForm.name,
                    type: vaxForm.type,
                    producer: vaxForm.producer || 'Bio Farma',
                    minStock: Number(vaxForm.minStock) || 10
                };

                setVaccines([...vaccines, newVax]);
                setIsVaxModalOpen(false);
                showToast('Master Vaksin berhasil ditambahkan!', 'success');
                setVaxForm({ name: '', type: 'Vaksin Wajib', producer: 'Bio Farma', minStock: 10 });
            };

            const handleDeleteTx = (id) => {
                setConfirmModal({
                    message: 'Apakah Anda yakin ingin menghapus catatan transaksi ini?',
                    onConfirm: () => {
                        setTransactions(transactions.filter(t => t.id !== id));
                        setConfirmModal(null);
                        showToast('Transaksi berhasil dihapus', 'success');
                    }
                });
            };

            const downloadCSV = (type) => {
                let csvContent = "data:text/csv;charset=utf-8,";
                
                if (type === 'transactions') {
                    csvContent += "ID Transaksi,Tanggal,Jenis,Nama Vaksin,Lot ID,Dosis,No Batch,Kadaluarsa,Produsen,Jumlah,Catatan\n";
                    transactions.forEach(t => {
                        csvContent += `"${t.id}","${t.date}","${t.type.toUpperCase()}","${t.vaccineName}","${t.lotId}","${t.dose}","${t.batchNo}","${t.expireDate}","${t.producer}","${t.qty}","${t.notes || '-'}"\n`;
                    });
                } else {
                    csvContent += "Nama Vaksin,Kategori,Lot ID,No Batch,Tanggal Kadaluarsa,Produsen,Sisa Dosis Lot,Total Stok Vaksin\n";
                    calculatedStock.forEach(s => {
                        if (s.lots.length === 0) {
                            csvContent += `"${s.name}","${s.type}","-","-","-","${s.producer}","0","0"\n`;
                        } else {
                            s.lots.forEach(l => {
                                csvContent += `"${s.name}","${s.type}","${l.lotId}","${l.batchNo}","${l.expireDate}","${l.producer}","${l.currentStock}","${s.currentStock}"\n`;
                            });
                        }
                    });
                }

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Laporan_${type}_Vaksin_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const totalDoses = calculatedStock.reduce((acc, curr) => acc + curr.currentStock, 0);
            const lowStockCount = calculatedStock.filter(s => s.isLowStock).length;
            
            const allNearExpLots = [];
            calculatedStock.forEach(s => {
                s.nearExpLots.forEach(l => {
                    allNearExpLots.push({
                        vaccineName: s.name,
                        ...l
                    });
                });
            });

            const filteredStock = calculatedStock.filter(v => {
                const matchSearch = v.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    v.producer.toLowerCase().includes(searchQuery.toLowerCase());
                const matchType = filterType === 'all' || v.type === filterType;
                return matchSearch && matchType;
            });

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-24 md:pb-8">
                    
                    {}
                    <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                                    <Syringe className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">VaxTrack Lot System</h1>
                                    <p className="text-xs text-emerald-100">Manajemen Stok & Identifikasi Lot Vaksin</p>
                                </div>
                            </div>

                            <button
                                onClick={() => setIsTxModalOpen(true)}
                                className="hidden sm:flex items-center space-x-2 bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-xl font-medium text-sm shadow transition"
                            >
                                <PlusCircle className="w-4 h-4" />
                                <span>Catat Keluar/Masuk</span>
                            </button>
                        </div>
                    </header>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed top-16 right-4 z-50 max-w-sm p-4 rounded-xl shadow-xl text-white text-xs font-semibold transition-all ${
                            toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
                        }`}>
                            {toast.message}
                        </div>
                    )}

                    {/* CONFIRMATION MODAL */}
                    {confirmModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-2xl space-y-4 text-center">
                                <AlertTriangle className="w-10 h-10 text-amber-500 mx-auto" />
                                <p className="text-sm font-semibold text-slate-700">{confirmModal.message}</p>
                                <div className="flex space-x-2 pt-2">
                                    <button 
                                        onClick={() => setConfirmModal(null)} 
                                        className="flex-1 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-xl"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={confirmModal.onConfirm} 
                                        className="flex-1 py-2 bg-rose-600 text-white text-xs font-bold rounded-xl shadow"
                                    >
                                        Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONTAINER KONTEN UTAMA */}
                    <main className="max-w-6xl mx-auto px-4 pt-4">

                        {/* TAB NAVIGATION (DESKTOP) */}
                        <div className="hidden md:flex space-x-2 mb-6 border-b border-slate-200 pb-2">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${
                                    activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <LayoutDashboard className="w-4 h-4" />
                                <span>Dashboard</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('stock')}
                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${
                                    activeTab === 'stock' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <Package className="w-4 h-4" />
                                <span>Stok Realtime & Lot ID</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('transactions')}
                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${
                                    activeTab === 'transactions' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <ArrowLeftRight className="w-4 h-4" />
                                <span>Riwayat Transaksi</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('export')}
                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition ${
                                    activeTab === 'export' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <Download className="w-4 h-4" />
                                <span>Export CSV</span>
                            </button>

                                            </div>

                                            <div>
                                                <label className="block text-slate-600 font-semibold mb-1">Tgl Kadaluarsa *</label>
                                                <input
                                                    type="date"
                                                    required
                                                    value={txForm.expireDate}
                                                    onChange={(e) => setTxForm({ ...txForm, expireDate: e.target.value })}
                                                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-1">Jumlah Dosis *</label>
                                            <input
                                                type="number"
                                                min="1"
                                                required
                                                placeholder="Contoh: 20"
                                                value={txForm.qty}
                                                onChange={(e) => setTxForm({ ...txForm, qty: e.target.value })}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-1">Takaran Dosis</label>
                                            <input
                                                type="text"
                                                placeholder="Misal: 0.5 ml"
                                                value={txForm.dose}
                                                onChange={(e) => setTxForm({ ...txForm, dose: e.target.value })}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                    </div>

                                    {txForm.type === 'masuk' && (
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-1">Produsen / Pabrikan</label>
                                            <input
                                                type="text"
                                                placeholder="Bio Farma / SII / Sanofi"
                                                value={txForm.producer}
                                                onChange={(e) => setTxForm({ ...txForm, producer: e.target.value })}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Catatan Tambahan</label>
                                        <textarea
                                            rows="2"
                                            placeholder="Keterangan posyandu / tujuan..."
                                            value={txForm.notes}
                                            onChange={(e) => setTxForm({ ...txForm, notes: e.target.value })}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        ></textarea>
                                    </div>

                                    <div className="pt-2">
                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition"
                                        >
                                            Simpan Transaksi
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: TAMBAH MASTER VAKSIN */}
                    {isVaxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-slate-800 text-base">Tambah Jenis Vaksin baru</h3>
                                    <button onClick={() => setIsVaxModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <form onSubmit={handleAddVaccine} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Nama Vaksin *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Contoh: Rotavirus"
                                            value={vaxForm.name}
                                            onChange={(e) => setVaxForm({ ...vaxForm, name: e.target.value })}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Kategori Vaksin</label>
                                        <select
                                            value={vaxForm.type}
                                            onChange={(e) => setVaxForm({ ...vaxForm, type: e.target.value })}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        >
                                            <option value="Vaksin Wajib">Vaksin Wajib</option>
                                            <option value="Vaksin Pilihan">Vaksin Pilihan</option>
                                            <option value="Vaksin Khusus">Vaksin Khusus</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Produsen Utama</label>
                                        <input
                                            type="text"
                                            placeholder="Bio Farma / SII"
                                            value={vaxForm.producer}
                                            onChange={(e) => setVaxForm({ ...vaxForm, producer: e.target.value })}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Batas Minimal Stok Alert</label>
                                        <input
                                            type="number"
                                            value={vaxForm.minStock}
                                            onChange={(e) => setVaxForm({ ...vaxForm, minStock: e.target.value })}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>

                                    <div className="pt-2">
                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition"
                                        >
                                            Simpan Master Vaksin
                                        </button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    )}

                    {/* MOBILE BOTTOM NAVIGATION */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center md:hidden z-30 shadow-lg">
                        <button
                            onClick={() => setActiveTab('dashboard')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
                        >
                            <LayoutDashboard className="w-5 h-5" />
                            <span className="text-[10px]">Dashboard</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('stock')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'stock' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
                        >
                            <Package className="w-5 h-5" />
                            <span className="text-[10px]">Stok & Lot</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('transactions')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
                        >
                            <ArrowLeftRight className="w-5 h-5" />
                            <span className="text-[10px]">Transaksi</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('export')}
                            className={`flex flex-col items-center space-y-1 ${activeTab === 'export' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
                        >
                            <Download className="w-5 h-5" />
                            <span className="text-[10px]">CSV</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
