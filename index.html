<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaxTrack Cloud - Date Fixed Final</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // KONFIGURASI: TEMPEL URL GOOGLE SCRIPT ANDA DI SINI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzYRWtMss4mafbjt9jYTcVi38x6vuJR6Izs2EC1qZPkTOSRuMXlPNwjWuE-09t5nMOJ/exec"; 
        // ==========================================

        const LayoutDashboard = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>);
        const Package = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>);
        const ArrowLeftRight = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>);
        const PlusCircle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>);
        const AlertTriangle = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>);
        const Search = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
        const TrendingUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>);
        const TrendingDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>);
        const Syringe = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>);
        const Trash2 = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
        const X = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const ChevronDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>);
        const ChevronUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>);
        const Edit3 = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1219430786797687 0 0 1 0 4.242548672 2.1219430786797687 0 0 0 0-4.242548672z"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>);
        const FileUp = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
        const FileDown = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
        const RefreshCcw = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-9 9Z"/><path d="M12 12v4"/><path d="m16 16-4 4-4-4"/></svg>);

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const fileInputRef = useRef(null);

            const [vaccines, setVaccines] = useState(() => {
                const saved = localStorage.getItem('vax_master_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('vax_tx_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isVaxModalOpen, setIsVaxModalOpen] = useState(false);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [isEditTxModalOpen, setIsEditTxModalOpen] = useState(false);
            const [isCsvPreviewOpen, setIsCsvPreviewOpen] = useState(false);
            const [expandedVaxId, setExpandedVaxId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterType, setFilterType] = useState('all');

            const [vaxForm, setVaxForm] = useState({ name: '', category: 'Vaksin Wajib', minStock: 10 });
            const [editVax, setEditVax] = useState(null);
            const [editTx, setEditTx] = useState(null);
            const [csvPreviewItems, setCsvPreviewItems] = useState([]);
            const [txType, setTxType] = useState('masuk');
            const [txHeader, setTxHeader] = useState({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
            const [txItems, setTxItems] = useState([{}]);

            // SUPER DATE FORMATTER: Memastikan tanggal selalu YYYY-MM-DD
            const superFormatDate = (dateVal) => {
                if (!dateVal) return '';
                
                // Jika sudah format YYYY-MM-DD, kembalikan langsung
                if (typeof dateVal === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateVal)) {
                    return dateVal;
                }

                try {
                    // Coba handle format DD/MM/YYYY atau DD-MM-YYYY
                    if (typeof dateVal === 'string') {
                        const parts = dateVal.split(/[\/\-]/);
                        if (parts.length === 3 && parts[0].length <= 2) {
                            const day = parts[0].padStart(2, '0');
                            const month = parts[1].padStart(2, '0');
                            const year = parts[2].length === 4 ? parts[2] : '20' + parts[2];
                            return `${year}-${month}-${day}`;
                        }
                    }

                    // Coba parse dengan Date object (menangani format ISO dan Google Sheets)
                    const d = new Date(dateVal);
                    if (isNaN(d.getTime())) return dateVal; // Jika gagal, kembalikan asli
                    
                    return d.toISOString().split('T')[0];
                } catch (e) {
                    return dateVal;
                }
            };

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => { localStorage.setItem('vax_master_v2', JSON.stringify(vaccines)); }, [vaccines]);
            useEffect(() => { localStorage.setItem('vax_tx_v2', JSON.stringify(transactions)); }, [transactions]);

            const syncToSheet = async (payload) => {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { console.error("Sync Error:", e); }
            };

            const restoreFromSheet = async (sheetName) => {
    setIsSyncing(true);
    try {
        const response = await fetch(`${GAS_URL}?sheet=${sheetName}`);
        const data = await response.json();
        if (sheetName === 'Master') {
            const restoredMaster = data.map(item => ({
                id: item.idvaksin, name: item.namavaksin, category: item.kategori, minStock: Number(item.batasminimum)
            }));
            setVaccines(restoredMaster);
            showToast('Master Vaksin dimuat ulang!', 'success');
        } else if (sheetName === 'Masuk' || sheetName === 'Keluar') {
            const restoredTxs = data.map(item => {
                // PERBAIKAN: Mencoba berbagai kemungkinan nama kolom Batch
                const batchValue = item.nobatch || item.noBatch || item.NoBatch || item['No Batch'] || '-';
                const producerValue = item.merk || item.producer || item.Merk || item['Merk'] || '-';
                
                return {
                    id: item.idtransaksi || `TX-REST-${Math.random()}`,
                    vaccineId: item.namavaksin, vaccineName: item.namavaksin, type: sheetName === 'Masuk' ? 'masuk' : 'keluar',
                    date: superFormatDate(item.tanggal), sourceOrFor: item.sumber || item.peruntukan,
                    lotId: item.idmasuk || item.lotid, 
                    producer: producerValue, 
                    batchNo: batchValue, 
                    expireDate: superFormatDate(item.kadaluarsa), dose: item.dosis || '-', unit: item.satuan || 'dosis',
                    qty: Number(item.jumlah), notes: 'Restored from Sheet'
                };
            });
            // Menggunakan spread operator agar data lama tidak hilang sepenuhnya jika diinginkan, 
            // atau ganti menjadi setTransactions(restoredTxs) untuk sinkronisasi total.
            setTransactions([...restoredTxs, ...transactions]);
            showToast(`Data ${sheetName} dimuat ulang!`, 'success');
        }
    } catch (e) { showToast('Gagal mengambil data dari Google Sheet', 'error'); }
    setIsSyncing(false);
};


            const getCalculatedStock = () => {
                const today = new Date();
                return vaccines.map((vax) => {
                    const vaxTxs = transactions.filter(t => t.vaccineId === vax.id || t.vaccineName === vax.name);
                    const lotMap = {};
                    vaxTxs.forEach((tx) => {
                        const key = tx.lotId;
                        if (!lotMap[key]) lotMap[key] = { lotId: key, batchNo: tx.batchNo, expireDate: tx.expireDate, producer: tx.producer, masuk: 0, keluar: 0, currentStock: 0 };
                        if (tx.type === 'masuk') lotMap[key].masuk += Number(tx.qty);
                        else lotMap[key].keluar += Number(tx.qty);
                        lotMap[key].currentStock = lotMap[key].masuk - lotMap[key].keluar;
                    });
                    const lots = Object.values(lotMap).filter(l => l.masuk > 0).sort((a, b) => new Date(a.expireDate) - new Date(b.expireDate));
                    const currentStock = lots.reduce((sum, l) => sum + l.currentStock, 0);
                    const nearExpLots = lots.filter(l => {
                        if (l.currentStock <= 0) return false;
                        return Math.ceil((new Date(l.expireDate) - today) / 86400000) <= 30;
                    });
                    return { ...vax, lots, currentStock, isLowStock: currentStock <= vax.minStock, nearExpLots };
                });
            };

            const calculatedStock = getCalculatedStock();

            const handleAddVaccine = async (e) => {
                e.preventDefault();
                if (!vaxForm.name) return;
                const newVax = { id: 'V-' + Date.now(), name: vaxForm.name, category: vaxForm.category, minStock: Number(vaxForm.minStock) };
                setVaccines([...vaccines, newVax]);
                await syncToSheet({ action: 'addMaster', ...newVax });
                setIsVaxModalOpen(false);
                setVaxForm({ name: '', category: 'Vaksin Wajib', minStock: 10 });
                showToast('Jenis vaksin disimpan!', 'success');
            };

            const handleUpdateVaccine = async (e) => {
                e.preventDefault();
                const updatedVax = { ...editVax };
                setVaccines(vaccines.map(v => v.id === updatedVax.id ? updatedVax : v));
                await syncToSheet({ action: 'editMaster', id: updatedVax.id, category: updatedVax.category, minStock: updatedVax.minStock });
                setIsEditModalOpen(false);
                setEditVax(null);
                showToast('Batas minimum stok diperbarui!', 'success');
            };

            const generateSmartLotId = (vaccine, batchNo, date, currentSessionIds) => {
    // 1. Buat prefix yang bersih (Contoh: "Vaksin BCG" -> "bcg")
    const vaxNameShort = vaccine.name.toLowerCase()
        .replace(/\s+/g, '') 
        .replace(/vaksin/g, '') 
        .trim();
    
    // 2. Cek apakah Lot dengan Batch, Tanggal, dan Vaksin yang sama sudah ada (agar tidak duplikat)
    const existingLot = transactions.find(t => 
        (t.vaccineId === vaccine.id || t.vaccineName === vaccine.name) && 
        t.batchNo === batchNo && 
        t.date === date && 
        t.type === 'masuk'
    );
    if (existingLot) return existingLot.lotId;

    // 3. FILTER KETAT: Hanya ambil ID yang dimulai dengan prefix vaksin ini
    // Contoh: Jika vaxNameShort adalah 'bcg', maka 'opv1' akan diabaikan.
    const usedIdsForThisVax = [
        ...transactions
            .filter(t => t.type === 'masuk' && t.lotId && t.lotId.toLowerCase().startsWith(vaxNameShort))
            .map(t => t.lotId), 
        ...currentSessionIds.filter(id => id.toLowerCase().startsWith(vaxNameShort))
    ];

    let maxNumber = 0;
    usedIdsForThisVax.forEach(id => {
        // Ambil angka di akhir string
        const match = id.match(/\d+$/); 
        if (match) {
            const num = parseInt(match[0], 10);
            if (num > maxNumber) maxNumber = num;
        }
    });

    // 4. Hasil akhir: prefix + (angka tertinggi vaksin tersebut + 1)
    return `${vaxNameShort}${maxNumber + 1}`;
};



            const handleSaveTransactions = async (e) => {
    e.preventDefault();
    if (!txHeader.date || !txHeader.sourceOrFor) {
        showToast('Tanggal dan Sumber/Peruntukan harus diisi!');
        return;
    }
    setIsSyncing(true);
    const newTxs = [];
    const currentSessionIds = [];
    for (let item of txItems) {
        if (!item.vaccineId || !item.qty) continue;
        const vax = vaccines.find(v => v.id === item.vaccineId);
        let lotId, producer = '-', batchNo = '-', expireDate = '-';
        
        if (txType === 'masuk') {
            lotId = generateSmartLotId(vax, item.batchNo, txHeader.date, currentSessionIds);
            currentSessionIds.push(lotId);
            producer = item.producer || '-'; 
            batchNo = item.batchNo || '-'; 
            expireDate = item.expireDate || '-';
        } else {
            lotId = item.lotId;
            // PERBAIKAN: Mencari di data transaksi lokal untuk mendapatkan info batch
            const sourceTx = transactions.find(t => t.lotId === lotId && t.type === 'masuk');
            if (sourceTx) { 
                producer = sourceTx.producer; 
                batchNo = sourceTx.batchNo; 
                expireDate = sourceTx.expireDate; 
            } else {
                // Jika tidak ditemukan di lokal, kita beri tanda agar user tahu data batch tidak tersedia
                batchNo = "TIDAK DITEMUKAN"; 
            }
        }
        const transactionData = {
            id: `TX-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            vaccineId: item.vaccineId, vaccineName: vax ? vax.name : 'Unknown',
            type: txType, date: txHeader.date, sourceOrFor: txHeader.sourceOrFor,
            lotId: lotId, producer: producer, batchNo: batchNo, expireDate: expireDate,
            dose: item.dose || '-', unit: item.unit || 'dosis', qty: Number(item.qty), notes: item.notes || ''
        };
        newTxs.push(transactionData);
        await syncToSheet(transactionData);
    }
    if (newTxs.length === 0) { setIsSyncing(false); showToast('Mohon isi minimal satu jenis vaksin!'); return; }
    setTransactions([...newTxs, ...transactions]);
    setIsTxModalOpen(false);
    setTxItems([{}]);
    setTxHeader({ date: new Date().toISOString().split('T')[0], sourceOrFor: '' });
    setIsSyncing(false);
    showToast('Berhasil disimpan & Sync Cloud!', 'success');
};


            const handleUpdateTx = async (e) => {
                e.preventDefault();
                const updatedTx = { ...editTx };
                setTransactions(transactions.map(t => t.id === updatedTx.id ? updatedTx : t));
                await syncToSheet({ action: 'editTx', ...updatedTx });
                setIsEditTxModalOpen(false);
                setEditTx(null);
                showToast('Transaksi berhasil diperbarui!', 'success');
            };

            const handleDeleteTx = (id) => {
                setConfirmModal({
                    message: 'Hapus transaksi ini dari lokal?',
                    onConfirm: () => {
                        setTransactions(transactions.filter(t => t.id !== id));
                        setConfirmModal(null);
                        showToast('Dihapus dari lokal', 'success');
                    }
                });
            };

            const downloadTemplate = () => {
                const headers = "Tanggal Masuk,Sumber,Nama Vaksin,Merk,No Batch,Kadaluarsa(YYYY-MM-DD),Dosis,Satuan,Jumlah\n";
                const example = "2023-10-27,Dinkes Kota,BCG,Bio Farma,BCG2026A,2026-12-31,0.05ml,dosis,100\n";
                const blob = new Blob([headers + example], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "Template_Vaksin_Masuk.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    const dataRows = lines.slice(1);
                    const previewItems = [];
                    dataRows.forEach((line, i) => {
                        const row = line.split(',');
                        if (row.length >= 9) {
                            previewItems.push({
                                tempId: i, date: superFormatDate(row[0].trim()), source: row[1].trim(), vaxName: row[2].trim(),
                                producer: row[3].trim(), batchNo: row[4].trim(), expireDate: superFormatDate(row[5].trim()),
                                dose: row[6].trim(), unit: row[7].trim(), qty: row[8].trim()
                            });
                        }
                    });
                    if (previewItems.length === 0) showToast('Tidak ada data valid dalam file CSV', 'error');
                    else { setCsvPreviewItems(previewItems); setIsCsvPreviewOpen(true); }
                };
                reader.readAsText(file);
            };

            const confirmCsvImport = async () => {
                setIsSyncing(true);
                const newTxs = [];
                const currentSessionIds = [];
                let errorCount = 0;
                for (let item of csvPreviewItems) {
                    const vax = vaccines.find(v => v.name.toLowerCase() === item.vaxName.toLowerCase());
                    if (!vax) { errorCount++; continue; }
                    const lotId = generateSmartLotId(vax, item.batchNo, item.date, currentSessionIds);
                    currentSessionIds.push(lotId);
                    const transactionData = {
                        id: `TX-CSV-${Date.now()}-${item.tempId}`,
                        vaccineId: vax.id, vaccineName: vax.name, type: 'masuk',
                        date: item.date, sourceOrFor: item.source, lotId: lotId,
                        producer: item.producer, batchNo: item.batchNo, expireDate: item.expireDate,
                        dose: item.dose, unit: item.unit, qty: Number(item.qty), notes: 'Imported via CSV'
                    };
                    newTxs.push(transactionData);
                    await syncToSheet(transactionData);
                }
                if (newTxs.length > 0) setTransactions([...newTxs, ...transactions]);
                setIsCsvPreviewOpen(false);
                setIsSyncing(false);
                if (errorCount > 0) showToast(`${errorCount} vaksin tidak ditemukan di Master`, 'error');
                showToast(`Berhasil mengimpor ${newTxs.length} data!`, 'success');
            };

            const filteredStock = calculatedStock.filter(v => 
                v.name.toLowerCase().includes(searchQuery.toLowerCase()) && 
                (filterType === 'all' || v.category === filterType)
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-24 md:pb-8">
                    <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl"><Syringe className="w-6 h-6 text-white" /></div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">VaxTrack Cloud</h1>
                                    <p className="text-xs text-emerald-100">Full Date Formatting Enabled</p>
                                </div>
                            </div>
                            <button onClick={() => setIsTxModalOpen(true)} className="hidden sm:flex items-center space-x-2 bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-xl font-medium text-sm shadow transition">
                                <PlusCircle className="w-4 h-4" />
                                <span>Catat Mutasi</span>
                            </button>
                        </div>
                    </header>

                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Edit Transaksi {editTx.type === 'masuk' ? 'Masuk' : 'Keluar'}</h3>
                                    <button onClick={() => setIsEditTxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>
                                <form onSubmit={handleUpdateTx} className="space-y-3 text-xs">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-1">Tanggal</label>
                                            <input required type="date" value={superFormatDate(editTx.date)} onChange={(e) => setEditTx({...editTx, date: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-1">Sumber/Untuk</label>
                                            <input required type="text" value={editTx.sourceOrFor} onChange={(e) => setEditTx({...editTx, sourceOrFor: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-lg" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-1">Jumlah</label>
                                        <input required type="number" value={editTx.qty} onChange={(e) => setEditTx({...editTx, qty: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-lg" />
                                    </div>
                                    {editTx.type === 'masuk' && (
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-slate-600 font-semibold mb-1">No Batch</label>
                                                <input type="text" value={editTx.batchNo} onChange={(e) => setEditTx({...editTx, batchNo: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-lg uppercase" />
                                            </div>
                                            <div>
                                                <label className="block text-slate-600 font-semibold mb-1">Exp Date</label>
                                                <input type="date" value={superFormatDate(editTx.expireDate)} onChange={(e) => setEditTx({...editTx, expireDate: e.target.value})} className="w-full p-2 bg-slate-50 border rounded-lg" />
                                            </div>
                                        </div>
                                    )}
                                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition">Simpan Perubahan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isTxModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3 border-slate-100">
                                    <h3 className="font-bold text-base">Catat Mutasi (Batch Entry)</h3>
                                    <button onClick={() => setIsTxModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="flex gap-2 mb-4">
                                    <button onClick={() => { setTxType('masuk'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'masuk' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN MASUK</button>
                                    <button onClick={() => { setTxType('keluar'); setTxItems([{}]); }} className={`flex-1 py-2 rounded-xl font-bold transition ${txType === 'keluar' ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}>VAKSIN KELUAR</button>
                                </div>
                                <form onSubmit={handleSaveTransactions} className="space-y-4 text-xs">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <div><label className="block font-semibold mb-1">Tanggal *</label><input required type="date" value={txHeader.date} onChange={(e) => setTxHeader({...txHeader, date: e.target.value})} className="w-full p-2 bg-white border rounded-lg" /></div>
                                        <div><label className="block font-semibold mb-1">{txType === 'masuk' ? 'Sumber Vaksin *' : 'Peruntukan *'}</label><input required type="text" value={txHeader.sourceOrFor} onChange={(e) => setTxHeader({...txHeader, sourceOrFor: e.target.value})} className="w-full p-2 bg-white border rounded-lg" placeholder="Contoh: Dinkes / Puskesmas A" /></div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead><tr className="text-slate-500"><th className="p-2 border-b">Vaksin</th>{txType === 'masuk' ? (<><th className="p-2 border-b">Merk</th><th className="p-2 border-b">Batch</th><th className="p-2 border-b">Kadaluarsa</th><th className="p-2 border-b">Dosis</th><th className="p-2 border-b">Satuan</th></>) : (<th className="p-2 border-b">ID Masuk (Lot ID)</th>)}<th className="p-2 border-b">Jumlah</th><th className="p-2 border-b w-10"></th></tr></thead>
                                            <tbody>
                                                {txItems.map((item, idx) => (
                                                    <tr key={idx}>
                                                        <td className="p-2 border-b"><select required value={item.vaccineId} onChange={(e) => {
                                                            const newItems = [...txItems]; newItems[idx].vaccineId = e.target.value; setTxItems(newItems);
                                                        }} className="w-full p-1.5 bg-slate-50 border rounded">
                                                            <option value="">-- Pilih --</option>
                                                            {vaccines.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                                        </select></td>
                                                        {txType === 'masuk' ? (
                                                            <>
                                                                <td className="p-2 border-b"><input type="text" value={item.producer} onChange={(e) => { const n = [...txItems]; n[idx].producer = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.batchNo} onChange={(e) => { const n = [...txItems]; n[idx].batchNo = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded uppercase" /></td>
                                                                <td className="p-2 border-b"><input type="date" value={item.expireDate} onChange={(e) => { const n = [...txItems]; n[idx].expireDate = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.dose} onChange={(e) => { const n = [...txItems]; n[idx].dose = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" placeholder="0.5ml" /></td>
                                                                <td className="p-2 border-b"><input type="text" value={item.unit} onChange={(e) => { const n = [...txItems]; n[idx].unit = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" placeholder="Dosis" /></td>
                                                            </>
                                                        ) : (
                                                            <td className="p-2 border-b"><select required value={item.lotId} onChange={(e) => { const n = [...txItems]; n[idx].lotId = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded">
                                                                <option value="">-- Pilih ID Masuk --</option>
                                                                {calculatedStock.find(v => v.id === item.vaccineId)?.lots.filter(l => l.currentStock > 0).map(l => <option key={l.lotId} value={l.lotId}>{l.lotId} (Sisa: {l.currentStock})</option>)}
                                                            </select></td>
                                                        )}
                                                        <td className="p-2 border-b"><input required type="number" value={item.qty} onChange={(e) => { const n = [...txItems]; n[idx].qty = e.target.value; setTxItems(n); }} className="w-full p-1.5 border rounded" /></td>
                                                        <td className="p-2 border-b text-center"><button type="button" onClick={() => { const n = [...txItems]; n.splice(idx,1); setTxItems(n.length ? n : [{}]); }} className="text-rose-400"><Trash2 className="w-4 h-4" /></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <button type="button" onClick={() => setTxItems([...txItems, {}])} className="flex items-center space-x-1 text-emerald-600 font-bold py-2 px-4 rounded-lg border border-emerald-600 hover:bg-emerald-50 transition"><PlusCircle className="w-4 h-4" /><span>Tambah Baris</span></button>
                                    <button type="submit" disabled={isSyncing} className={`w-full py-3 text-white font-bold rounded-xl shadow-md transition ${isSyncing ? 'bg-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                        {isSyncing ? 'Sedang Mengirim Data...' : 'Simpan & Sync Cloud'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center md:hidden z-30 shadow-lg">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><LayoutDashboard className="w-5 h-5" /><span className="text-[10px]">Dashboard</span></button>
                        <button onClick={() => setActiveTab('stock')} className={`flex flex-col items-center space-y-1 ${activeTab === 'stock' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><Package className="w-5 h-5" /><span className="text-[10px]">Stok & Lot</span></button>
                        <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><ArrowLeftRight className="w-5 h-5" /><span className="text-[10px]">Transaksi</span></button>
                        <button onClick={() => setActiveTab('system')} className={`flex flex-col items-center space-y-1 ${activeTab === 'system' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}><RefreshCcw className="w-5 h-5" /><span className="text-[10px]">Sistem</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
